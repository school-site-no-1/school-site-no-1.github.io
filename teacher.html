<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Расписание уроков</title>
    <style>
        /* ============ БАЗА (светлая) ============ */
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',Arial,sans-serif;
            background:#f0f4f8;
            padding:10px;
            color:#2d3748;
            min-height:100vh;
        }
        .container{
            max-width:1200px;margin:0 auto;
            background:#fff;
            border-radius:12px;
            border:1px solid #e2e8f0;
            padding:14px;
            box-shadow:0 2px 8px rgba(0,0,0,.05);
            text-align:center;
        }

        /* ============ ШАПКА (светлая) ============ */
        .header{
            display:flex;flex-direction:column;
            border-bottom:2px solid #4a5568;
            padding-bottom:6px;margin-bottom:8px;
            text-align:left;
        }
        .header-top{
            display:flex;justify-content:space-between;align-items:center;
            flex-wrap:wrap;gap:8px;
        }
        .header-top-left{order:1;display:flex;flex-direction:column;align-items:flex-start;gap:0}
        .header-top-center{order:3;flex:0 1 auto;text-align:center}
        .header-top-right{order:2;display:flex;flex-direction:column;align-items:flex-end}

        .changes-text{
            font-size:12px;font-weight:700;
            color:#975a16;letter-spacing:.5px;line-height:1.2;text-align:left;
        }

        .header-selector{
            display:flex;align-items:center;justify-content:center;gap:6px;
            padding:4px 8px;
            background:#edf2f7;border:1px solid #cbd5e0;border-radius:8px;
        }
        .header-selector label{font-size:14px;color:#2d3748}
        .header-selector select{
            padding:4px 8px;border:1px solid #4a5568;border-radius:6px;
            font-size:13px;background:#fff;color:#2d3748;
            cursor:pointer;min-width:120px;max-width:200px;outline:none;
            font-family:inherit;
        }
        .header-selector select:hover{border-color:#2d3748}
        .header-selector select:focus{border-color:#3182ce;box-shadow:0 0 0 2px rgba(49,130,206,.2)}
        .header-selector .refresh-btn{
            padding:4px 8px;background:#4a5568;color:#fff;border:none;border-radius:6px;
            cursor:pointer;font-size:13px;transition:background .15s;
        }
        .header-selector .refresh-btn:hover{background:#2d3748}

        #clockContainer{display:flex;justify-content:flex-end;align-items:center;min-height:32px;width:100%}
        #clockContainer .clock-wrapper{display:flex!important;align-items:center!important;gap:8px!important}
        #clockContainer svg{width:24px;height:24px;flex-shrink:0;stroke:#2d3748!important}
        #clockContainer .clock-text{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
        #clockContainer .clock-text .date{font-size:11px;color:#2d3748;font-weight:600}
        #clockContainer .clock-text .day{display:none}
        #clockContainer .clock-text .digital-time{
            font-size:18px;color:#2d3748;font-weight:700;
            font-variant-numeric:tabular-nums;font-family:'Courier New',monospace;letter-spacing:.5px;
        }

        /* ============ НАВИГАЦИЯ ДНЕЙ (светлая) ============ */
        .day-navigation{
            display:flex;justify-content:center;gap:4px;
            padding:4px 0;margin-bottom:4px;flex-wrap:wrap;
            border-bottom:1px solid #e2e8f0;text-align:left;
        }
        .day-btn{
            padding:3px 10px;border:2px solid #e2e8f0;border-radius:20px;
            background:#f7fafc;color:#2d3748;
            font-size:12px;font-weight:600;cursor:pointer;
            transition:all .2s ease;white-space:nowrap;font-family:inherit;
        }
        .day-btn:hover{background:#edf2f7;border-color:#cbd5e0}
        .day-btn.active{background:#4a5568;color:#fff;border-color:#4a5568;box-shadow:0 2px 8px rgba(74,85,104,.3)}
        .day-btn.active:hover{background:#2d3748;border-color:#2d3748}
        .day-btn.today{border-color:#4a5568;background:#edf2f7}
        .day-btn.today.active{background:#4a5568;color:#fff}

        /* ============ ЕДИНАЯ ОБЛАСТЬ ============ */
        .table-area{display:inline-block;max-width:100%;min-width:0;vertical-align:top;text-align:left}

        .info{
            display:flex;justify-content:space-between;
            font-size:11px;color:#718096;
            padding:4px 8px;background:#edf2f7;
            border:1px solid #cbd5e0;margin-bottom:6px;border-radius:6px;
            flex-wrap:wrap;gap:4px;width:100%;box-sizing:border-box;
        }
        .info .count{color:#2d3748;font-weight:600}
        .info .update{color:#a0aec0;font-size:10px}

        /* ============ ТАБЛИЦА (светлое тело) ============ */
        .table-wrap{overflow-x:auto;border-radius:8px;width:100%}
        table{width:auto;border-collapse:collapse;font-size:14px;margin:0 auto;min-width:360px}

        /* ТЁМНАЯ ШАПКА ТАБЛИЦЫ — единственное тёмное место */
        thead th{
            background:#2d3748;
            color:#63b3ed;
            padding:8px 6px;
            text-align:center;
            font-weight:700;
            font-size:11px;
            white-space:nowrap;
            letter-spacing:.6px;
            text-transform:uppercase;
            border-bottom:2px solid #3182ce;
            border-right:1px solid #4a5568;
        }
        thead th:last-child{border-right:none}

        tbody tr{border-bottom:1.5px solid #e2e8f0}
        tbody tr:last-child{border-bottom:none}
        tbody td{
            padding:10px 6px;text-align:center;font-size:13px;
            vertical-align:middle;border-right:1px solid #e2e8f0;
            color:#2d3748;background:#fff;
        }
        tbody td:last-child{border-right:none}

        /* ============ ТЕКУЩИЙ УРОК ============ */
        tbody tr.current-lesson{
            background:transparent !important;
            font-weight:700;
            position:relative;
        }
        tbody tr.current-lesson td{
            color:#1a202c !important;
            background:transparent;
            position:relative;
            z-index:2;
        }
        tbody tr.current-lesson td.num{color:#2b6cb0 !important;font-weight:800}
        tbody tr.current-lesson td.period .time-start{color:#2b6cb0 !important;font-weight:800}
        tbody tr.current-lesson td.period .time-end{color:#4a5568 !important;font-weight:700}
        tbody tr.current-lesson td.class{color:#2d3748 !important}
        tbody tr.current-lesson td.subject{color:#1a202c !important;font-weight:700}
        tbody tr.current-lesson td.room{color:#c05621 !important;font-weight:700}

        /* Прогресс-бар урока (тёмно-синий, без мигания) */
        tbody tr.current-lesson::after{
            content:'';
            position:absolute;
            left:0;bottom:0;
            height:10px;
            width:100%;
            background:linear-gradient(90deg,#2b6cb0 0%,#1a365d 100%);
            transform-origin:left center;
            transform:scaleX(var(--lesson-progress, 0));
            z-index:3;
            pointer-events:none;
            box-shadow:0 0 6px rgba(26,54,93,.55);
            border-radius:0 4px 4px 0;
        }

        /* ============ ПРОШЕДШИЕ ============ */
        tbody tr.past-lesson{background:transparent}
        tbody tr.past-lesson td{color:#a0aec0 !important;background:transparent}
        tbody tr.past-lesson td.num{color:#cbd5e0 !important}
        tbody tr.past-lesson td.period .time-start{color:#a0aec0 !important}
        tbody tr.past-lesson td.period .time-end{color:#cbd5e0 !important}
        tbody tr.past-lesson td.class{color:#a0aec0 !important}
        tbody tr.past-lesson td.subject{color:#a0aec0 !important}
        tbody tr.past-lesson td.room{color:#cbd5e0 !important}

        /* ============ ПУСТЫЕ ПРОШЕДШИЕ ============ */
        tbody tr.empty-lesson{background:transparent}
        tbody tr.empty-lesson td{color:#cbd5e0 !important;font-style:italic;background:transparent}
        tbody tr.empty-lesson td.num{color:#e2e8f0 !important}
        tbody tr.empty-lesson td.period .time-start{color:#cbd5e0 !important}
        tbody tr.empty-lesson td.period .time-end{color:#e2e8f0 !important}
        tbody tr.empty-lesson td.class{color:#cbd5e0 !important}
        tbody tr.empty-lesson td.subject{color:#cbd5e0 !important}
        tbody tr.empty-lesson td.room{color:#e2e8f0 !important}

        /* ============ Колонки ============ */
        tbody td.num{font-weight:800;color:#2d3748;font-size:13px;width:32px;min-width:28px}
        tbody td.period{padding:8px 4px;white-space:nowrap;width:78px;min-width:68px}
        tbody td.period .time-start{
            font-weight:700;color:#2d3748;font-size:13px;line-height:1.2;
            font-family:'Courier New',monospace;letter-spacing:.3px;
        }
        tbody td.period .time-end{
            color:#718096;font-size:11px;line-height:1.2;
            font-family:'Courier New',monospace;
        }
        tbody td.class{
            font-weight:600;color:#2d3748;font-size:12px;
            white-space:normal;line-height:1.2;min-width:40px;width:54px;max-width:70px;
        }
        tbody td.subject{
            text-align:center;font-weight:500;color:#2d3748;
            font-size:13px;min-width:110px;width:150px;max-width:190px;line-height:1.3;
        }
        tbody td.room{
            font-weight:600;color:#9a3412;font-size:12px;
            white-space:normal;line-height:1.2;
            min-width:40px;width:54px;max-width:70px;
            font-family:'Courier New',monospace;
        }

        /* ============ ПЕРЕМЕНА (без боковых полос) ============ */
        .break-row{
            background:#feebc8 !important;
            border-bottom:1.5px solid #f6ad55;
            position:relative;
            overflow:hidden;
        }
        .break-row td{
            padding:10px 6px !important;
            color:#7b341e !important;font-weight:700;
            border-right-color:#f6ad55;
            text-align:left !important;
            position:relative;
            overflow:hidden;
            line-height:1.2;
            background:transparent !important;
            z-index:2;
        }
        .break-row td:last-child{border-right:none}
        .break-row td .break-label{
            display:flex;align-items:center;justify-content:flex-start;
            gap:8px;flex-wrap:wrap;
            color:#7b341e;position:relative;z-index:2;
        }
        .break-row td .break-label .break-text{font-weight:700;color:#7b341e}
        .break-row td .break-label .break-duration{
            font-size:10px;color:#975a16;font-weight:600;opacity:.85;
        }
        .break-row td .break-label .break-time-left{
            color:#7b341e;font-weight:800;font-size:18px !important;
            padding:0 6px;border-radius:12px;white-space:nowrap;
            font-variant-numeric:tabular-nums;letter-spacing:.5px;
            font-family:'Courier New',monospace;
        }
        .break-row td .break-label .break-lunch{
            display:inline-flex;align-items:center;gap:3px;
            background:linear-gradient(180deg,#fbd38d 0%,#f6ad55 100%);
            color:#7b341e;font-weight:800;font-size:11px;
            padding:2px 8px;border-radius:10px;
            box-shadow:0 1px 2px rgba(123,52,30,.2);
            margin-left:4px;letter-spacing:.3px;
            text-decoration:none;cursor:pointer;
            transition:background .15s, transform .1s;
        }
        .break-row td .break-label .break-lunch:hover{
            background:linear-gradient(180deg,#f6ad55 0%,#dd6b20 100%);
            color:#fff;transform:translateY(-1px);
        }
        .break-row td .break-label .break-lunch:active{transform:translateY(0)}

        /* Прогресс-бар перемены — во всю высоту */
        .break-progress-bar{
            position:absolute;
            left:0;top:0;
            height:100%;
            background:linear-gradient(90deg,rgba(251,211,141,.55) 0%,rgba(246,173,85,.35) 100%);
            transition:width .3s ease;
            z-index:1;
            pointer-events:none;
        }

        /* ============ ФУТЕР ============ */
        .footer{
            text-align:center;color:#a0aec0;font-size:10px;
            border-top:1px solid #e2e8f0;padding-top:6px;margin-top:10px;
            display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
        }
        .footer .version{color:#a0aec0}
        .footer .gen-time{color:#cbd5e0}
        .no-lessons-msg{
            text-align:center;padding:24px 0;color:#a0aec0;font-size:14px;min-width:360px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-top">
            <div class="header-top-left">
                <span class="changes-text" id="changesText">📌 Изменения<br>на сегодня</span>
            </div>
            <div class="header-top-center">
                <div class="header-selector">
                    <label for="teacherSelect">👨‍🏫</label>
                    <select id="teacherSelect"><option value="">Загрузка...</option></select>
                    <button class="refresh-btn" onclick="refreshData()">🔄</button>
                </div>
            </div>
            <div class="header-top-right">
                <div id="clockContainer"></div>
            </div>
        </div>
    </div>

    <div class="day-navigation" id="dayNavigation">
        <button class="day-btn" data-day="ПН">ПН</button>
        <button class="day-btn" data-day="ВТ">ВТ</button>
        <button class="day-btn" data-day="СР">СР</button>
        <button class="day-btn" data-day="ЧТ">ЧТ</button>
        <button class="day-btn" data-day="ПТ">ПТ</button>
        <button class="day-btn" data-day="СБ">СБ</button>
    </div>

    <div class="table-area">
        <div class="info">
            <span class="count" id="lessonCount">📚 0 уроков</span>
            <span class="update" id="updateTime">🔄 обновлено: загрузка...</span>
        </div>

        <div class="table-wrap">
            <div id="scheduleTable">
                <div class="no-lessons-msg">⏳ Загрузка расписания...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="version">🏷️ v7.5.0</span>
        <span class="gen-time" id="genTime">📅 загрузка...</span>
    </div>
</div>

<script src="/clock.js"></script>

<script>
(function () {
    'use strict';

    const DAYS      = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
    const DAYS_RU   = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const DAYS_PREP = ['понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу'];

    const LESSON_PERIODS = [
        {start:'08:30',end:'09:10'},{start:'09:20',end:'10:00'},
        {start:'10:10',end:'10:50'},{start:'11:05',end:'11:45'},
        {start:'12:00',end:'12:40'},{start:'12:55',end:'13:35'},
        {start:'13:45',end:'14:25'},{start:'14:35',end:'15:15'},
        {start:'15:25',end:'16:05'}
    ];
    const BREAKS = [
        {after:1, start:'09:10', end:'09:20', duration:10},
        {after:2, start:'10:00', end:'10:10', duration:10},
        {after:3, start:'10:50', end:'11:05', duration:15},
        {after:4, start:'11:45', end:'12:00', duration:15},
        {after:5, start:'12:40', end:'12:55', duration:15},
        {after:6, start:'13:35', end:'13:45', duration:10},
        {after:7, start:'14:25', end:'14:35', duration:10},
        {after:8, start:'15:15', end:'15:25', duration:10}
    ];
    const LUNCH_URL = 'https://school-site-no-1.github.io/school-menu/viewer.html';

    let teachersList        = [];
    let currentTeacher      = null;
    let currentDay          = '';
    let currentScheduleData = {};
    let breakTimer          = null;
    let selectedDay         = '';
    let __lastState         = { lesson: -1, breakAfter: -1 };

    const urlParams    = new URLSearchParams(window.location.search);
    const teacherParam = urlParams.get('teacher') || urlParams.get('id') || '';
    const dayParam     = urlParams.get('day') || urlParams.get('d') || '';

    function dowFromDate(d) {
        const n = (d.getDay() + 6) % 7;
        return (n >= 0 && n <= 5) ? n : 0;
    }
    function getVirtualDow() {
        if (window.__virtualTime) return window.__virtualTime.getState().vdow;
        return dowFromDate(new Date());
    }

    function getLessonWord(num) {
        const d = num % 10, dd = num % 100;
        if (dd >= 11 && dd <= 19) return 'уроков';
        if (d === 1) return 'урок';
        if (d >= 2 && d <= 4) return 'урока';
        return 'уроков';
    }
    function parseTime(s) {
        if (!s) return 0;
        const p = s.split(':');
        return (+p[0]) * 60 + (+p[1]);
    }
    function formatTimeWithSeconds(m) {
        if (m < 0) m = 0;
        const mm = Math.floor(m);
        const ss = Math.floor((m - mm) * 60);
        return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    }

    function getScheduleDay() {
        const now   = new Date();
        const total = now.getHours() * 60 + now.getMinutes();
        const thr   = 16 * 60 + 40;

        let dow = getVirtualDow();
        if (total >= thr) dow = (dow + 1) % 6;

        return {
            targetDay:     DAYS[dow]      || 'ПН',
            targetDayFull: DAYS_RU[dow]   || 'Понедельник',
            targetDayPrep: DAYS_PREP[dow] || 'понедельник',
            isTomorrow:    total >= thr,
            dayIndex:      dow
        };
    }
    function isSelectedDayToday(day) {
        return day === DAYS[getVirtualDow()];
    }
    function getCurrentLessonNum() {
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        for (let i = 0; i < LESSON_PERIODS.length; i++) {
            if (t >= parseTime(LESSON_PERIODS[i].start) && t < parseTime(LESSON_PERIODS[i].end)) return i + 1;
        }
        return 0;
    }
    function getLastFinishedLessonNum() {
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes();
        let last  = 0;
        for (let i = 0; i < LESSON_PERIODS.length; i++) {
            if (t >= parseTime(LESSON_PERIODS[i].end)) last = i + 1;
        }
        return last;
    }
    function getCurrentBreak() {
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes();
        for (const b of BREAKS) {
            if (t >= parseTime(b.start) && t < parseTime(b.end)) return b;
        }
        return null;
    }
    function getBreakTimeLeft(b) {
        if (!b) return 0;
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        return Math.max(0, parseTime(b.end) - t);
    }
    function getBreakTotalTime(b) {
        if (!b) return 0;
        return parseTime(b.end) - parseTime(b.start);
    }
    function getLessonProgress(lessonNum) {
        if (!lessonNum || lessonNum < 1 || lessonNum > LESSON_PERIODS.length) return 0;
        const p = LESSON_PERIODS[lessonNum - 1];
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        const start = parseTime(p.start);
        const end   = parseTime(p.end);
        if (t <= start) return 0;
        if (t >= end)   return 1;
        return (t - start) / (end - start);
    }
    function getBreakProgress(b) {
        if (!b) return 0;
        const now = new Date();
        const t   = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        const start = parseTime(b.start);
        const end   = parseTime(b.end);
        if (t <= start) return 0;
        if (t >= end)   return 1;
        return (t - start) / (end - start);
    }

    function updateBreakTimer() {
        const b = getCurrentBreak();
        const brRow = document.querySelector('tr.break-row');
        if (brRow && b) {
            const bar = brRow.querySelector('.break-progress-bar');
            if (bar) bar.style.width = (getBreakProgress(b) * 100).toFixed(2) + '%';
            const lbl = brRow.querySelector('.break-time-left');
            if (lbl) lbl.textContent = '⏳ ' + formatTimeWithSeconds(getBreakTimeLeft(b));
        }
    }

    function updatePageTitle(name, day) {
        const el = document.getElementById('pageTitle');
        if (!el) return;
        const p = name.split(' ');
        let s   = name;
        if (p.length >= 2) s = `${p[0]} ${p[1][0]}.${p[2] ? p[2][0] + '.' : ''}`;
        el.textContent = `${s} - ${DAYS_RU[DAYS.indexOf(day)] || day}`;
    }
    function updateDayButtons(day) {
        const t = getScheduleDay();
        document.querySelectorAll('.day-btn').forEach(b => {
            b.classList.remove('active', 'today');
            if (b.dataset.day === t.targetDay) b.classList.add('today');
            if (b.dataset.day === day)         b.classList.add('active');
        });
    }

    async function loadTeachersList() {
        try {
            const r = await fetch('/data/teachers.json?_=' + Date.now());
            if (!r.ok) throw new Error('Не удалось загрузить список учителей');
            const data = await r.json();
            teachersList = data.teachers || [];

            const sel = document.getElementById('teacherSelect');
            sel.innerHTML = '';
            if (teachersList.length === 0) {
                sel.innerHTML = '<option value="">Нет учителей</option>';
                return;
            }
            teachersList.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            teachersList.forEach((t, i) => {
                const o = document.createElement('option');
                o.value = t.name || t.id || i;
                o.textContent = t.name || t.id || `Учитель ${i + 1}`;
                if (t.id) o.dataset.id = t.id;
                if (t.scheduleFile) o.dataset.scheduleFile = t.scheduleFile;
                sel.appendChild(o);
            });

            let chosen = null;
            if (teacherParam) {
                chosen = teachersList.find(t =>
                    t.name === teacherParam ||
                    t.id   === teacherParam ||
                    t.fileName === teacherParam + '.html'
                );
                if (chosen) sel.value = chosen.name;
            }
            if (!chosen && teachersList.length > 0) {
                sel.value = teachersList[0].name;
                chosen    = teachersList[0];
            }
            if (chosen) {
                currentTeacher = chosen;
                const info     = getScheduleDay();
                selectedDay    = (dayParam && DAYS.includes(dayParam.toUpperCase()))
                    ? dayParam.toUpperCase()
                    : info.targetDay;
                await loadTeacherSchedule(chosen, selectedDay);
            }
        } catch (e) {
            console.error(e);
            document.getElementById('teacherSelect').innerHTML = '<option value="">❌ Ошибка</option>';
            showError('❌ Не удалось загрузить список учителей');
        }
    }

    async function loadTeacherSchedule(teacher, day) {
        try {
            const info   = getScheduleDay();
            const target = day || selectedDay || info.targetDay;
            if (!DAYS.includes(target)) throw new Error('Некорректный день: ' + target);
            currentDay = target;

            const file = teacher.scheduleFile ||
                         teacher.fileName?.replace('.html', '.json') ||
                         `schedule_${teacher.id || 'default'}.json`;
            const r = await fetch(`/data/${file}?_=${Date.now()}`);
            if (!r.ok) throw new Error('Не удалось загрузить расписание: ' + file);
            currentScheduleData = await r.json();
            updateUI(teacher, currentScheduleData, currentDay);
        } catch (e) {
            console.error(e);
            showError('❌ ' + e.message);
        }
    }

    function updateUI(teacher, data, day) {
        const prep = DAYS_PREP[DAYS.indexOf(day)] || 'сегодня';
        document.getElementById('changesText').innerHTML = `📌 Изменения<br>на ${prep}`;
        updatePageTitle(teacher.name, day);
        updateDayButtons(day);
        renderSchedule(data, day);
        if (data.last_update) {
            document.getElementById('updateTime').textContent = '🔄 обновлено: ' + data.last_update;
        }
        document.getElementById('genTime').textContent = '📅 ' + new Date().toLocaleString('ru-RU');
        startBreakTimer();
    }
    function startBreakTimer() {
        if (breakTimer) { clearInterval(breakTimer); breakTimer = null; }
        breakTimer = setInterval(updateBreakTimer, 1000);
    }

    function renderSchedule(data, day) {
        const container = document.getElementById('scheduleTable');
        const lessons   = data[day] || [];

        if (!lessons.length) {
            container.innerHTML = `<div class="no-lessons-msg">📌 Уроков нет на ${DAYS_RU[DAYS.indexOf(day)] || day}</div>`;
            document.getElementById('lessonCount').textContent = '📚 0 уроков';
            return;
        }

        const grouped = {};
        lessons.forEach(l => {
            const n = l.lesson || l.num || 0;
            if (!n) return;
            if (!grouped[n]) grouped[n] = { classes: [], subjects: [], rooms: [] };
            if (l.class   && !grouped[n].classes.includes(l.class))   grouped[n].classes.push(l.class);
            if (l.subject && !grouped[n].subjects.includes(l.subject)) grouped[n].subjects.push(l.subject);
            if (l.room    && !grouped[n].rooms.includes(l.room))       grouped[n].rooms.push(l.room);
        });

        const cur     = getCurrentLessonNum();
        const lastF   = getLastFinishedLessonNum();
        const cb      = getCurrentBreak();
        const isToday = isSelectedDayToday(day);

        let html = `<table><thead><tr>
            <th>№</th><th>Время</th><th>Класс</th><th>Предмет</th><th>Кабинет</th>
        </tr></thead><tbody>`;

        let total = 0;
        const max = 9;

        for (let i = 1; i <= max; i++) {
            const item   = grouped[i];
            const period = LESSON_PERIODS[i - 1] || { start: '--:--', end: '--:--' };
            const empty  = !item || item.classes.length === 0;
            if (!empty) total++;

            const isCur       = isToday && i === cur;
            const isPast      = isToday && !empty && i <= lastF && i !== cur;
            const isEmptyPast = isToday && empty && i <= lastF && i !== cur;

            let cls = '';
            let styleAttr = '';
            if (isCur) {
                cls = ' class="current-lesson"';
                styleAttr = ` style="--lesson-progress:${getLessonProgress(i).toFixed(4)};"`;
            } else if (isPast) {
                cls = ' class="past-lesson"';
            } else if (isEmptyPast) {
                cls = ' class="empty-lesson"';
            }

            const cl = empty ? '—' : item.classes.join(', ');
            const sb = empty ? '—' : item.subjects.join(', ');
            const rm = empty ? '—' : item.rooms.join(', ');

            html += `<tr${cls}${styleAttr}>
                <td class="num">${i}</td>
                <td class="period"><div class="time-start">${period.start}</div><div class="time-end">${period.end}</div></td>
                <td class="class">${cl}</td>
                <td class="subject">${sb}</td>
                <td class="room">${rm}</td>
            </tr>`;

            if (i < max) {
                const br = BREAKS.find(b => b.after === i);
                if (br) {
                    const nowBr = isToday && cb && cb.after === i;
                    if (!nowBr) continue;

                    const left = getBreakTimeLeft(br);
                    const prg  = getBreakProgress(br);
                    const txt  = `⏳ ${formatTimeWithSeconds(left)}`;
                    const lunchBadge = (br.duration === 15)
                        ? `<a class="break-lunch" href="${LUNCH_URL}" target="_blank" rel="noopener noreferrer" title="Меню школьной столовой">🍽 Обед</a>`
                        : '';
                    html += `<tr class="break-row">
                        <td colspan="5" style="position:relative;overflow:hidden;">
                            <div class="break-progress-bar" style="width:${(prg*100).toFixed(2)}%;"></div>
                            <div class="break-label">
                                <span class="break-time-left">${txt}</span>
                                <span class="break-text">Перемена</span>
                                <span class="break-duration">${br.duration} мин</span>
                                ${lunchBadge}
                            </div>
                        </td>
                    </tr>`;
                }
            }
        }
        html += '</tbody></table>';

        container.innerHTML = html;
        document.getElementById('lessonCount').textContent =
            `📚 ${total} ${getLessonWord(total)}`;
    }

    function showError(msg) {
        document.getElementById('scheduleTable').innerHTML =
            `<div class="no-lessons-msg">${msg}</div>`;
        document.getElementById('pageTitle').textContent = 'Ошибка - Расписание';
    }

    function onTeacherChange() {
        const val = document.getElementById('teacherSelect').value;
        if (!val) {
            document.getElementById('scheduleTable').innerHTML =
                '<div class="no-lessons-msg">👨‍🏫 Выберите учителя</div>';
            return;
        }
        const t = teachersList.find(x => x.name === val);
        if (t) {
            currentTeacher = t;
            loadTeacherSchedule(t, selectedDay || currentDay);
            const u = new URL(window.location);
            u.searchParams.set('teacher', t.name);
            if (selectedDay) u.searchParams.set('day', selectedDay);
            window.history.pushState({}, '', u);
        }
    }
    function onDayClick(e) {
        const btn = e.currentTarget;
        const day = btn.dataset.day;
        if (!day || day === selectedDay) return;
        selectedDay = day;
        if (currentTeacher) {
            loadTeacherSchedule(currentTeacher, day);
            const u = new URL(window.location);
            u.searchParams.set('day', day);
            if (currentTeacher) u.searchParams.set('teacher', currentTeacher.name);
            window.history.pushState({}, '', u);
        }
    }

    window.refreshData = function () {
        if (currentTeacher) loadTeacherSchedule(currentTeacher, selectedDay || currentDay);
        else loadTeachersList();
    };

    document.addEventListener('virtualtime:change', function (e) {
        const s = e.detail;
        if (!s) return;

        const wantedDay = DAYS[s.vdow] || 'ПН';
        if (wantedDay !== selectedDay) {
            selectedDay = wantedDay;
            if (currentTeacher) {
                loadTeacherSchedule(currentTeacher, wantedDay);
                return;
            }
        }
        if (currentTeacher && currentScheduleData[currentDay]) {
            updateUI(currentTeacher, currentScheduleData, currentDay);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        if (typeof initClock === 'function') initClock('clockContainer');

        document.querySelectorAll('.day-btn').forEach(b => b.addEventListener('click', onDayClick));
        loadTeachersList();
        document.getElementById('teacherSelect').addEventListener('change', onTeacherChange);

        setInterval(() => {
            if (!currentTeacher || !currentScheduleData[currentDay]) return;
            const wantedDay = DAYS[getVirtualDow()];
            if (selectedDay && selectedDay !== wantedDay) return;

            const cur = getCurrentLessonNum();
            const br  = getCurrentBreak();
            const brAfter = br ? br.after : -1;

            if (cur !== __lastState.lesson || brAfter !== __lastState.breakAfter) {
                __lastState = { lesson: cur, breakAfter: brAfter };
                renderSchedule(currentScheduleData, currentDay);
                return;
            }

            const curRow = document.querySelector('tr.current-lesson');
            if (curRow) {
                curRow.style.setProperty('--lesson-progress', getLessonProgress(cur).toFixed(4));
            }
            const brRow = document.querySelector('tr.break-row');
            if (brRow && br) {
                const bar = brRow.querySelector('.break-progress-bar');
                if (bar) bar.style.width = (getBreakProgress(br) * 100).toFixed(2) + '%';
            }
        }, 1000);
    });
})();
</script>
