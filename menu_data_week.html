<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍽️ Reels — Дни и блюда</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0a09;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      color: #f5efe8;
    }

    .reels-container {
      max-width: 420px;
      width: 100%;
      height: 90vh;
      max-height: 800px;
      background: #1a1715;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .reels-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 10px 20px;
      background: #1a1715;
      border-bottom: 1px solid #2f2a26;
      flex-shrink: 0;
      z-index: 5;
    }
    .reels-header .brand {
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.3px;
      color: #f5efe8;
    }
    .reels-header .brand span {
      color: #c7a88c;
    }
    .reels-header .badge {
      background: #2f2a26;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 13px;
      color: #b8a69a;
    }

    .reels-track {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    /* каждый слайд — это день */
    .reels-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 12px 16px 16px 16px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .reels-slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    /* день */
    .day-label {
      font-size: 20px;
      font-weight: 600;
      color: #f5efe8;
      padding-bottom: 8px;
      border-bottom: 1px solid #2f2a26;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .day-label .day-cal {
      font-size: 14px;
      font-weight: 400;
      color: #c7a88c;
      background: #2f2a26;
      padding: 2px 14px;
      border-radius: 40px;
    }

    /* контейнер для блюд внутри дня */
    .day-slides-track {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
      border-radius: 20px;
    }

    .dish-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 4px 0;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: #3d3530 transparent;
    }
    .dish-slide.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .dish-slide::-webkit-scrollbar {
      width: 3px;
    }
    .dish-slide::-webkit-scrollbar-thumb {
      background: #3d3530;
      border-radius: 20px;
    }

    /* карточка блюда */
    .dish-card {
      background: #24201d;
      border-radius: 24px;
      padding: 16px 16px 14px;
      border: 1px solid #33302c;
      margin-bottom: 2px;
    }
    .dish-card .dish-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dish-card .dish-photo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3d3530;
      background: #2f2a26;
      flex-shrink: 0;
    }
    .dish-card .dish-photo-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #2f2a26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #6a5f56;
      border: 2px solid #3d3530;
      flex-shrink: 0;
    }
    .dish-card .dish-info {
      flex: 1;
      min-width: 0;
    }
    .dish-card .dish-info .dish-name {
      font-size: 18px;
      font-weight: 600;
      color: #f5efe8;
      line-height: 1.2;
    }
    .dish-card .dish-info .meal-label {
      font-size: 13px;
      color: #b8a69a;
    }
    .dish-card .dish-cal {
      font-size: 13px;
      color: #c7a88c;
      background: #2f2a26;
      padding: 2px 14px;
      border-radius: 40px;
      display: inline-block;
      margin-top: 6px;
    }
    .dish-card .product-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid #2f2a26;
    }
    .dish-card .product-list .p-item {
      font-size: 14px;
      color: #cfc3b8;
      background: #2a2622;
      padding: 2px 12px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dish-card .product-list .p-item .p-detail {
      color: #a08f81;
      font-size: 12px;
    }

    /* индикаторы дней (внизу) */
    .slide-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 0 14px 0;
      flex-shrink: 0;
      background: #1a1715;
      flex-wrap: wrap;
    }
    .slide-dot {
      width: 8px;
      height: 8px;
      border-radius: 20px;
      background: #3d3530;
      transition: 0.25s;
      cursor: pointer;
    }
    .slide-dot.active {
      background: #c7a88c;
      width: 26px;
    }

    /* индикатор блюд внутри дня (маленькие точки) */
    .dish-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 4px 0 2px 0;
      flex-shrink: 0;
    }
    .dish-dot {
      width: 6px;
      height: 6px;
      border-radius: 20px;
      background: #3d3530;
      transition: 0.25s;
      cursor: pointer;
    }
    .dish-dot.active {
      background: #c7a88c;
      width: 16px;
    }

    .nav-arrows {
      display: none;
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      pointer-events: none;
      padding: 0 10px;
      z-index: 10;
    }
    .nav-arrows button {
      pointer-events: auto;
      background: rgba(26, 23, 21, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid #3d3530;
      color: #f5efe8;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-arrows button:hover {
      background: #3d3530;
    }
    .nav-arrows .arrow-left {
      float: left;
    }
    .nav-arrows .arrow-right {
      float: right;
    }

    @media (min-width: 600px) {
      .reels-container {
        max-width: 520px;
        max-height: 780px;
        border-radius: 48px;
      }
      .nav-arrows {
        display: block;
      }
      .dish-card {
        padding: 20px 18px 16px;
      }
      .dish-card .dish-info .dish-name {
        font-size: 20px;
      }
    }
    @media (max-width: 480px) {
      .reels-container {
        height: 95vh;
        max-height: 700px;
        border-radius: 28px;
      }
      .reels-header .brand {
        font-size: 16px;
      }
    }

    .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6a5f56;
      font-size: 16px;
      flex-direction: column;
      gap: 12px;
    }
    .loading-placeholder .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2f2a26;
      border-top-color: #c7a88c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2f2a26;
      color: #f5efe8;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      opacity: 0;
      transition: 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="reels-container" id="reelsContainer">
  <div class="reels-header">
    <div class="brand">🍽️ <span>Reels</span> меню</div>
    <div class="badge" id="slideCounter">1 / 7</div>
  </div>

  <div class="reels-track" id="reelsTrack">
    <div class="loading-placeholder" id="loadingPlaceholder">
      <div class="spinner"></div>
      <span>Загрузка...</span>
    </div>
  </div>

  <div class="slide-indicator" id="slideIndicator"></div>

  <div class="nav-arrows" id="navArrows">
    <button class="arrow-left" id="prevSlideBtn">‹</button>
    <button class="arrow-right" id="nextSlideBtn">›</button>
  </div>
</div>

<script>
  (function() {
    const DEFAULT_DATA = {
      menu: {
        rows: [
          {
            label: 'Завтрак',
            cells: [
              { dish: 'Овсянка', photo: '', products: [{ name: 'Овсянка', gram: 50, cal: 180 }, { name: 'Яблоко', gram: 1, cal: 70 }, { name: 'Творог 5%', gram: 100, cal: 120 }] },
              { dish: 'Сырники', photo: '', products: [{ name: 'Сырники', gram: 150, cal: 280 }, { name: 'Сметана 15%', gram: 20, cal: 40 }, { name: 'Банан', gram: 1, cal: 105 }] },
              { dish: 'Омлет', photo: '', products: [{ name: 'Омлет', gram: 2, cal: 140 }, { name: 'Хлеб ржаной', gram: 40, cal: 90 }, { name: 'Помидор', gram: 60, cal: 15 }] },
              { dish: 'Яичница с зеленью', photo: '', products: [{ name: 'Яичница', gram: 2, cal: 140 }, { name: 'Хлеб ц.зерн.', gram: 45, cal: 110 }, { name: 'Мандарин', gram: 1, cal: 40 }] },
              { dish: 'Запеч. бутерброд', photo: '', products: [{ name: 'Бутерброд', gram: 1, cal: 150 }, { name: 'Сыр нежирный', gram: 20, cal: 60 }, { name: 'Яйцо', gram: 1, cal: 70 }, { name: 'Яблоко', gram: 1, cal: 70 }] },
              { dish: 'Гречка', photo: '', products: [{ name: 'Гречка', gram: 60, cal: 210 }, { name: 'Кефир 1%', gram: 200, cal: 90 }, { name: 'Ягоды', gram: 50, cal: 30 }] },
              { dish: 'Сырники', photo: '', products: [{ name: 'Сырники', gram: 120, cal: 220 }, { name: 'Сгущенка', gram: 20, cal: 60 }, { name: 'Персик', gram: 1, cal: 60 }] }
            ]
          },
          {
            label: 'Обед',
            cells: [
              { dish: 'Куриная грудка', photo: '', products: [{ name: 'Куриная грудка', gram: 100, cal: 165 }, { name: 'Рис белый', gram: 80, cal: 280 }, { name: 'Овощи', gram: 120, cal: 50 }] },
              { dish: 'Говядина', photo: '', products: [{ name: 'Говядина', gram: 90, cal: 180 }, { name: 'Гречка', gram: 70, cal: 245 }, { name: 'Морковь', gram: 40, cal: 16 }] },
              { dish: 'Тушеная печень', photo: '', products: [{ name: 'Печень', gram: 100, cal: 130 }, { name: 'Макароны тв.', gram: 90, cal: 315 }, { name: 'Лук', gram: 20, cal: 8 }] },
              { dish: 'Птица запеч.', photo: '', products: [{ name: 'Птица', gram: 80, cal: 130 }, { name: 'Булгар', gram: 40, cal: 140 }, { name: 'Перец', gram: 30, cal: 10 }, { name: 'Огурцы', gram: 50, cal: 8 }] },
              { dish: 'Индейка', photo: '', products: [{ name: 'Индейка', gram: 110, cal: 130 }, { name: 'Рис', gram: 60, cal: 210 }, { name: 'Кабачок', gram: 50, cal: 12 }] },
              { dish: 'Рыба (хек)', photo: '', products: [{ name: 'Хек', gram: 120, cal: 100 }, { name: 'Сметана 15%', gram: 30, cal: 60 }, { name: 'Картофель', gram: 100, cal: 80 }] },
              { dish: 'Куриная голень', photo: '', products: [{ name: 'Голень', gram: 130, cal: 200 }, { name: 'Макароны', gram: 90, cal: 315 }, { name: 'Арахис', gram: 5, cal: 28 }] }
            ]
          },
          {
            label: 'Ужин',
            cells: [
              { dish: 'Творог', photo: '', products: [{ name: 'Творог 5%', gram: 150, cal: 180 }, { name: 'Кефир 1%', gram: 200, cal: 90 }, { name: 'Яблоко', gram: 1, cal: 70 }] },
              { dish: 'Овощное рагу', photo: '', products: [{ name: 'Рагу', gram: 180, cal: 120 }, { name: 'Куриное филе', gram: 80, cal: 132 }, { name: 'Сыр', gram: 20, cal: 70 }] },
              { dish: 'Рыба на пару', photo: '', products: [{ name: 'Рыба', gram: 100, cal: 90 }, { name: 'Овощи', gram: 100, cal: 40 }, { name: 'Рис', gram: 40, cal: 140 }] },
              { dish: 'Тефтели', photo: '', products: [{ name: 'Тефтели', gram: 80, cal: 160 }, { name: 'Гречка', gram: 50, cal: 175 }, { name: 'Ряженка', gram: 150, cal: 90 }] },
              { dish: 'Мафины из птицы', photo: '', products: [{ name: 'Мафины', gram: 60, cal: 140 }, { name: 'Грибы', gram: 30, cal: 8 }, { name: 'Йогурт 3%', gram: 40, cal: 30 }, { name: 'Мандарин', gram: 1, cal: 40 }] },
              { dish: 'Омлет с зеленью', photo: '', products: [{ name: 'Омлет', gram: 2, cal: 140 }, { name: 'Хлеб ржаной', gram: 30, cal: 70 }, { name: 'Кефир', gram: 150, cal: 68 }] },
              { dish: 'Птица тушеная', photo: '', products: [{ name: 'Птица', gram: 90, cal: 140 }, { name: 'Цв. капуста', gram: 50, cal: 12 }, { name: 'Морковь', gram: 30, cal: 12 }, { name: 'Виноград', gram: 50, cal: 35 }] }
            ]
          }
        ]
      }
    };

    const DAYS = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
    let appData = null;
    let currentDayIndex = 0;
    let currentDishIndex = 0;
    let totalDays = 7;
    let dayDishes = []; // массив массивов блюд по дням

    const track = document.getElementById('reelsTrack');
    const indicator = document.getElementById('slideIndicator');
    const counter = document.getElementById('slideCounter');
    const prevBtn = document.getElementById('prevSlideBtn');
    const nextBtn = document.getElementById('nextSlideBtn');
    const toastEl = document.getElementById('toast');

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    let isSwipingDay = false;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._hide);
      toastEl._hide = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function roundNum(v) { return Math.round(v || 0); }

    // --- подготовка данных: dayDishes[день] = [блюдо1, блюдо2, ...] ---
    function prepareData(menuData) {
      const rows = menuData.rows || [];
      const dishesByDay = [];
      for (let d = 0; d < 7; d++) {
        dishesByDay[d] = [];
      }
      rows.forEach((row) => {
        const mealLabel = row.label || '';
        row.cells.forEach((cell, dayIdx) => {
          if (!cell || !cell.dish) return;
          dishesByDay[dayIdx].push({
            day: DAYS[dayIdx],
            meal: mealLabel,
            dish: cell.dish || 'Блюдо',
            photo: cell.photo || '',
            products: cell.products || []
          });
        });
      });
      // сортируем блюда внутри дня по приёму (завтрак, обед, ужин)
      const order = { 'Завтрак': 1, 'Обед': 2, 'Ужин': 3 };
      for (let d = 0; d < 7; d++) {
        dishesByDay[d].sort((a, b) => (order[a.meal] || 9) - (order[b.meal] || 9));
      }
      return dishesByDay;
    }

    // --- рендер одного блюда (карточка) ---
    function renderDishCard(dishData) {
      const photo = dishData.photo || '';
      const dishName = dishData.dish || 'Блюдо';
      const mealLabel = dishData.meal || '';
      let totalCal = 0;
      dishData.products.forEach(p => { totalCal += roundNum(p.cal); });

      let photoHtml = '';
      if (photo && photo.length > 50) {
        photoHtml = `<img class="dish-photo" src="${photo}" alt="${dishName}" />`;
      } else {
        photoHtml = `<div class="dish-photo-placeholder">📷</div>`;
      }

      let productsHtml = '';
      if (dishData.products && dishData.products.length) {
        productsHtml = `<div class="product-list">`;
        dishData.products.forEach(p => {
          const name = p.name || '';
          const gram = roundNum(p.gram);
          const cal = roundNum(p.cal);
          let detail = '';
          if (gram > 0) detail += gram + 'г';
          if (cal > 0) detail += (detail ? ' · ' : '') + cal + 'ккал';
          productsHtml += `
            <span class="p-item">
              ${name}
              <span class="p-detail">${detail}</span>
            </span>
          `;
        });
        productsHtml += `</div>`;
      } else {
        productsHtml = `<div style="color:#6a5f56;font-size:14px;padding:4px 0;">нет продуктов</div>`;
      }

      return `
        <div class="dish-card">
          <div class="dish-header">
            ${photoHtml}
            <div class="dish-info">
              <div class="dish-name">${dishName}</div>
              <div class="meal-label">${mealLabel}</div>
            </div>
          </div>
          <div class="dish-cal">🔥 ${totalCal} ккал</div>
          ${productsHtml}
        </div>
      `;
    }

    // --- построить слайды дней ---
    function buildSlides() {
      const placeholder = document.getElementById('loadingPlaceholder');
      if (placeholder) placeholder.remove();

      track.querySelectorAll('.reels-slide').forEach(el => el.remove());

      if (!dayDishes || dayDishes.length === 0 || dayDishes.every(d => d.length === 0)) {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'loading-placeholder';
        emptyMsg.innerHTML = `<span>😕 Нет данных</span>`;
        track.appendChild(emptyMsg);
        totalDays = 0;
        updateIndicators();
        updateCounter();
        return;
      }

      totalDays = dayDishes.length;
      for (let d = 0; d < totalDays; d++) {
        const daySlide = document.createElement('div');
        daySlide.className = 'reels-slide' + (d === currentDayIndex ? ' active' : '');
        daySlide.dataset.day = d;

        // заголовок дня
        const dayLabel = document.createElement('div');
        dayLabel.className = 'day-label';
        const totalDayCal = dayDishes[d].reduce((sum, dish) => {
          return sum + dish.products.reduce((s, p) => s + roundNum(p.cal), 0);
        }, 0);
        dayLabel.innerHTML = `
          <span>${DAYS[d]}</span>
          <span class="day-cal">🔥 ${totalDayCal} ккал</span>
        `;
        daySlide.appendChild(dayLabel);

        // контейнер для блюд
        const dishesTrack = document.createElement('div');
        dishesTrack.className = 'day-slides-track';
        dishesTrack.dataset.day = d;

        const dishes = dayDishes[d] || [];
        dishes.forEach((dish, idx) => {
          const dishDiv = document.createElement('div');
          dishDiv.className = 'dish-slide' + (idx === currentDishIndex && d === currentDayIndex ? ' active' : '');
          dishDiv.dataset.dishIndex = idx;
          dishDiv.innerHTML = renderDishCard(dish);
          dishesTrack.appendChild(dishDiv);
        });

        // точки для блюд
        const dishDots = document.createElement('div');
        dishDots.className = 'dish-dots';
        dishes.forEach((_, idx) => {
          const dot = document.createElement('span');
          dot.className = 'dish-dot' + (idx === currentDishIndex && d === currentDayIndex ? ' active' : '');
          dot.dataset.dishIndex = idx;
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            if (d === currentDayIndex) {
              goToDish(idx);
            }
          });
          dishDots.appendChild(dot);
        });

        daySlide.appendChild(dishesTrack);
        daySlide.appendChild(dishDots);

        // обработка свайпов для блюд внутри дня
        let dishTouchStartY = 0;
        let dishTouchEndY = 0;
        dishesTrack.addEventListener('touchstart', (e) => {
          dishTouchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        dishesTrack.addEventListener('touchend', (e) => {
          dishTouchEndY = e.changedTouches[0].screenY;
          const diff = dishTouchStartY - dishTouchEndY;
          if (Math.abs(diff) > 30 && d === currentDayIndex) {
            if (diff > 0) nextDish();
            else prevDish();
          }
        }, { passive: true });

        // колесо для блюд
        dishesTrack.addEventListener('wheel', (e) => {
          if (d === currentDayIndex && Math.abs(e.deltaY) > 15) {
            e.preventDefault();
            e.stopPropagation();
            if (e.deltaY > 0) nextDish();
            else prevDish();
          }
        }, { passive: false });

        track.appendChild(daySlide);
      }

      updateIndicators();
      updateCounter();
      updateDishDots();
    }

    // --- навигация по дням ---
    function goToDay(index) {
      if (index < 0) index = 0;
      if (index >= totalDays) index = totalDays - 1;
      if (index === currentDayIndex) return;

      const slides = track.querySelectorAll('.reels-slide');
      slides.forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      currentDayIndex = index;
      currentDishIndex = 0;
      updateIndicators();
      updateCounter();
      updateDishDots();

      // активируем первое блюдо в новом дне
      const activeSlide = track.querySelector('.reels-slide.active');
      if (activeSlide) {
        const dishSlides = activeSlide.querySelectorAll('.dish-slide');
        dishSlides.forEach((el, i) => {
          el.classList.toggle('active', i === 0);
        });
        const dots = activeSlide.querySelectorAll('.dish-dot');
        dots.forEach((el, i) => {
          el.classList.toggle('active', i === 0);
        });
      }
    }

    function nextDay() {
      if (totalDays === 0) return;
      if (currentDayIndex < totalDays - 1) goToDay(currentDayIndex + 1);
      else showToast('📅 Это последний день');
    }

    function prevDay() {
      if (totalDays === 0) return;
      if (currentDayIndex > 0) goToDay(currentDayIndex - 1);
      else showToast('📅 Это первый день');
    }

    // --- навигация по блюдам внутри дня ---
    function goToDish(index) {
      const activeSlide = track.querySelector('.reels-slide.active');
      if (!activeSlide) return;
      const dishSlides = activeSlide.querySelectorAll('.dish-slide');
      if (index < 0) index = 0;
      if (index >= dishSlides.length) index = dishSlides.length - 1;
      if (index === currentDishIndex) return;

      dishSlides.forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      currentDishIndex = index;
      updateDishDots();

      const dots = activeSlide.querySelectorAll('.dish-dot');
      dots.forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
    }

    function nextDish() {
      const activeSlide = track.querySelector('.reels-slide.active');
      if (!activeSlide) return;
      const dishSlides = activeSlide.querySelectorAll('.dish-slide');
      if (currentDishIndex < dishSlides.length - 1) {
        goToDish(currentDishIndex + 1);
      } else {
        showToast('🍽️ Это последнее блюдо в дне');
      }
    }

    function prevDish() {
      const activeSlide = track.querySelector('.reels-slide.active');
      if (!activeSlide) return;
      if (currentDishIndex > 0) {
        goToDish(currentDishIndex - 1);
      } else {
        showToast('🍽️ Это первое блюдо в дне');
      }
    }

    // --- индикаторы ---
    function updateIndicators() {
      indicator.innerHTML = '';
      for (let i = 0; i < totalDays; i++) {
        const dot = document.createElement('span');
        dot.className = 'slide-dot' + (i === currentDayIndex ? ' active' : '');
        dot.dataset.index = i;
        dot.addEventListener('click', () => goToDay(i));
        indicator.appendChild(dot);
      }
    }

    function updateCounter() {
      counter.textContent = totalDays > 0 ? `${currentDayIndex + 1} / ${totalDays}` : '0 / 0';
    }

    function updateDishDots() {
      const activeSlide = track.querySelector('.reels-slide.active');
      if (!activeSlide) return;
      const dots = activeSlide.querySelectorAll('.dish-dot');
      dots.forEach((el, i) => {
        el.classList.toggle('active', i === currentDishIndex);
      });
    }

    // --- загрузка данных ---
    function loadDataFromJson() {
      fetch('data.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          let menuData = data;
          if (data.menu && data.menu.rows) menuData = data.menu;
          else if (data.rows) menuData = data;
          else throw new Error('Неверная структура JSON');
          appData = menuData;
          dayDishes = prepareData(appData);
          buildSlides();
          showToast('✅ Данные загружены');
        })
        .catch(err => {
          console.warn('Ошибка загрузки JSON, используем встроенные данные:', err);
          appData = DEFAULT_DATA.menu;
          dayDishes = prepareData(appData);
          buildSlides();
          showToast('📦 Встроенные данные');
        });
    }

    // --- инициализация ---
    function init() {
      const placeholder = document.createElement('div');
      placeholder.className = 'loading-placeholder';
      placeholder.id = 'loadingPlaceholder';
      placeholder.innerHTML = `<div class="spinner"></div><span>Загрузка...</span>`;
      track.appendChild(placeholder);

      loadDataFromJson();

      // свайпы по дням (горизонтальные)
      track.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      track.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        const dx = touchStartX - touchEndX;
        const dy = touchStartY - touchEndY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
          if (dx > 0) nextDay();
          else prevDay();
        }
      }, { passive: true });

      // колесо для дней (горизонтальное/вертикальное)
      track.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 15) {
          e.preventDefault();
          if (e.deltaX > 0) nextDay();
          else prevDay();
        }
      }, { passive: false });

      prevBtn.addEventListener('click', prevDay);
      nextBtn.addEventListener('click', nextDay);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextDay();
        else if (e.key === 'ArrowLeft') prevDay();
        else if (e.key === 'ArrowDown') nextDish();
        else if (e.key === 'ArrowUp') prevDish();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>

</body>
</html>
