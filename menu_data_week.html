<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Меню на неделю</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 24px 20px 30px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .header {
            padding-bottom: 16px;
            border-bottom: 2px solid #e8ece4;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .header .day-name {
            font-size: 24px;
            font-weight: 700;
            color: #1f4a1e;
        }

        .header .day-name .today-badge {
            font-size: 13px;
            color: #fff;
            background: #1f4a1e;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
            display: inline-block;
            vertical-align: middle;
        }

        .header .day-total {
            font-size: 16px;
            color: #d68a3c;
            font-weight: 600;
        }

        .header .header-time {
            font-size: 15px;
            color: #8a9a88;
            font-weight: 500;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            flex: 1;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        /* СПИСОК ПРОДУКТОВ — ВЕРТИКАЛЬНО, ПОЛУПРОЗРАЧНЫЙ, БЕЗ ФОНА */
        .header-products {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(0,0,0,0.06);
            width: 100%;
        }

        .header-products .product-tag {
            color: rgba(0,0,0,0.5);
            font-size: 13px;
            font-weight: 400;
            padding: 1px 0;
            line-height: 1.4;
            background: none;
            border: none;
        }

        .slider-container {
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        .slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            cursor: grab;
        }

        .slider-track:active {
            cursor: grabbing;
        }

        .slider-slide {
            min-width: 100%;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .meal-card {
            border: 1px solid #e8ece4;
            border-radius: 12px;
            overflow: hidden;
            background: #fafbf9;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            min-height: 200px;
        }

        .meal-card .meal-image {
            width: 200px;
            min-height: 200px;
            object-fit: cover;
            background: #f0f3ee;
            flex-shrink: 0;
        }

        .meal-card .meal-image.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ccc;
            background: #f8faf5;
            width: 200px;
            min-height: 200px;
            flex-shrink: 0;
        }

        .meal-card .meal-body {
            padding: 16px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .meal-card .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .meal-card .meal-label {
            font-weight: 700;
            font-size: 18px;
            color: #1f4a1e;
        }

        .meal-card .meal-label.snack {
            color: #8a7a5a;
        }

        .meal-card .meal-text {
            color: #222;
            font-size: 16px;
            line-height: 1.5;
        }

        .meal-card .meal-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meal-card .meal-kcal {
            font-weight: 600;
            color: #7a8a78;
            font-size: 15px;
        }

        .meal-card .meal-bread {
            font-size: 14px;
            color: #b68a4a;
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            padding: 4px 0;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d0d8cc;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
        }

        .slider-dot.active {
            background: #1f4a1e;
            width: 24px;
            border-radius: 10px;
        }

        .day-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px solid #e8ece4;
        }

        .day-nav-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 16px;
            border-radius: 8px;
            transition: 0.2s;
            color: #1f4a1e;
            line-height: 1;
        }

        .day-nav-btn:hover {
            background: #f0f3ee;
        }

        .day-nav-btn:active {
            transform: scale(0.9);
        }

        .day-nav .day-label {
            font-size: 16px;
            font-weight: 600;
            color: #1f4a1e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f4a1e;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            background: #b33;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7a6a;
            font-size: 16px;
        }

        .loading .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e0e4dc;
            border-top: 3px solid #1f4a1e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #b33;
            font-size: 15px;
        }

        .error .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        .error button {
            padding: 6px 20px;
            border: none;
            border-radius: 30px;
            background: #1f4a1e;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        /* ============================================ */
        /*          МОБИЛЬНАЯ ВЕРСИЯ (REELS)            */
        /* ============================================ */
        @media (max-width: 600px) {
            body {
                padding: 0;
                background: #000;
                min-height: 100vh;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                background: #000;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 20;
                padding: 20px 20px 12px;
                border-bottom: none;
                margin-bottom: 0;
                background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
                pointer-events: none;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .header .day-name {
                color: #fff;
                font-size: 28px !important;
                font-weight: 800;
                text-shadow: 0 2px 8px rgba(0,0,0,0.7);
                letter-spacing: 0.5px;
            }

            .header .day-name .today-badge {
                background: #fff;
                color: #1f4a1e;
                font-size: 12px;
                padding: 2px 12px;
                display: inline-block;
                margin-left: 6px;
            }

            .header .day-total {
                color: #ffd700;
                font-size: 16px;
                text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            }

            .header .header-time {
                color: rgba(255,255,255,0.95);
                font-size: 32px !important;
                font-weight: 800;
                text-shadow: 0 2px 12px rgba(0,0,0,0.8);
                letter-spacing: 1px;
                line-height: 1;
                text-align: right;
                margin-top: 4px;
            }

            .header-left {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                flex: 1;
            }

            .header-right {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 2px;
                flex-shrink: 0;
            }

            /* ПРОДУКТЫ В ШАПКЕ — ВЕРТИКАЛЬНО, ПОЛУПРОЗРАЧНЫЕ, БЕЗ ФОНА */
            .header-products {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 1px;
                margin-top: 6px;
                padding-top: 6px;
                border-top: 1px solid rgba(255,255,255,0.06);
                width: 100%;
            }

            .header-products .product-tag {
                color: rgba(255,255,255,0.4);
                font-size: 13px;
                font-weight: 400;
                padding: 1px 0;
                line-height: 1.4;
                background: none;
                border: none;
                text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            }

            .slider-container {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                width: 100%;
                position: relative;
            }

            .slider-track {
                height: 100vh;
                align-items: center;
                width: 100%;
            }

            .slider-slide {
                padding: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
            }

            .meal-card {
                flex-direction: column;
                min-height: auto;
                border: none;
                border-radius: 0;
                background: #000;
                width: 100%;
                height: 100vh;
                position: relative;
                justify-content: center;
                align-items: center;
                display: flex;
            }

            .meal-card .meal-image {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                max-height: 100vh;
                object-fit: cover;
                border-radius: 0;
                position: absolute;
                top: 0;
                left: 0;
                display: block;
                flex-shrink: 0;
            }

            .meal-card .meal-image.empty {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                font-size: 100px;
                background: #1a1a1a;
                border-radius: 0;
                position: absolute;
                top: 0;
                left: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #555;
            }

            .meal-card .meal-body {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 30px 24px 140px;
                background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
                color: #fff;
                z-index: 10;
                pointer-events: none;
                display: block !important;
            }

            .meal-card .meal-header {
                margin-bottom: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-direction: row;
            }

            .meal-card .meal-label {
                color: #fff;
                font-size: 30px !important;
                font-weight: 800;
                text-shadow: 0 4px 16px rgba(0,0,0,0.9);
                display: block !important;
                letter-spacing: 0.5px;
            }

            .meal-card .meal-label.snack {
                color: #ffd700;
            }

            .meal-card .meal-text {
                color: #fff;
                font-size: 24px !important;
                font-weight: 500;
                text-shadow: 0 4px 16px rgba(0,0,0,0.9);
                line-height: 1.4;
                display: block !important;
                margin-top: 2px;
                text-align: center;
            }

            .meal-card .meal-bottom {
                margin-top: 10px;
                display: flex !important;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px;
                width: 100%;
            }

            .meal-card .meal-kcal {
                color: #ffd700;
                font-size: 18px !important;
                font-weight: 700;
                text-shadow: 0 4px 16px rgba(0,0,0,0.9);
                flex-shrink: 0;
            }

            .meal-card .meal-bread {
                color: #ffd700;
                font-size: 16px !important;
                font-weight: 500;
                text-shadow: 0 4px 16px rgba(0,0,0,0.9);
                flex-shrink: 0;
            }

            .meal-card .meal-products {
                display: none !important;
            }

            .tomorrow-products {
                display: none !important;
            }

            .slider-dots {
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
                gap: 14px;
                z-index: 14;
                margin-top: 0;
                padding: 0;
                pointer-events: auto;
                display: flex !important;
            }

            .slider-dot {
                width: 12px;
                height: 12px;
                background: rgba(255,255,255,0.2);
                border: 2px solid rgba(255,255,255,0.05);
                border-radius: 50%;
                display: block;
                transition: 0.3s;
            }

            .slider-dot.active {
                background: #fff;
                width: 18px;
                height: 18px;
                border-color: #fff;
                box-shadow: 0 0 20px rgba(255,255,255,0.15);
            }

            .day-nav {
                position: absolute;
                bottom: 24px;
                left: 0;
                right: 0;
                z-index: 15;
                margin-top: 0;
                padding: 0 20px;
                border-top: none;
                pointer-events: auto;
                display: flex !important;
            }

            .day-nav-btn {
                color: #fff;
                font-size: 36px;
                text-shadow: 0 2px 12px rgba(0,0,0,0.8);
                padding: 10px 18px;
                background: rgba(0,0,0,0.3);
                border-radius: 50%;
                width: 54px;
                height: 54px;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255,255,255,0.08);
                transition: 0.3s;
            }

            .day-nav-btn:hover {
                background: rgba(255,255,255,0.12);
            }

            .day-nav .day-label {
                color: #fff;
                font-size: 20px;
                font-weight: 700;
                text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            }
        }

        @media print {
            .day-nav-btn, .slider-dots, .tomorrow-products {
                display: none !important;
            }
            .container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .meal-card {
                flex-direction: row !important;
            }
            .meal-card .meal-image {
                width: 180px !important;
                height: 140px !important;
                min-height: 140px !important;
            }
            .meal-card .meal-image.empty {
                width: 180px !important;
                height: 140px !important;
                min-height: 140px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка меню...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIG =====
        const MEAL_ORDER = ['Завтрак', 'Перекус', 'Обед', 'Полдник', 'Ужин'];
        const MEAL_ICONS = {
            'Завтрак': '🍳',
            'Перекус': '🍎',
            'Обед': '🍗',
            'Полдник': '🥛',
            'Ужин': '🥘'
        };
        const MEAL_TIMES = {
            'Завтрак': '08:00',
            'Перекус': '10:00',
            'Обед': '14:00',
            'Полдник': '16:00',
            'Ужин': '19:00'
        };

        const DAY_NAMES = {
            mon: 'Понедельник',
            tue: 'Вторник',
            wed: 'Среда',
            thu: 'Четверг',
            fri: 'Пятница',
            sat: 'Суббота',
            sun: 'Воскресенье'
        };

        const DAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

        let menuData = null;
        let currentDayIndex = 0;
        let currentMealIndex = 0;

        // ===== HELPERS =====
        function getTodayIndex() {
            const today = new Date().getDay();
            return today === 0 ? 6 : today - 1;
        }

        function getDayKey(index) {
            return DAY_ORDER[index];
        }

        function getNextDayIndex(index) {
            return (index + 1) % 7;
        }

        function parseKcal(kcalStr) {
            if (!kcalStr) return 0;
            const cleaned = String(kcalStr).replace(/[^0-9]/g, '');
            return parseInt(cleaned) || 0;
        }

        function getDayTotal(dayData) {
            if (!dayData || !dayData.meals) return 0;
            return dayData.meals.reduce((sum, m) => sum + parseKcal(m.kcal), 0);
        }

        function getMealTime(label) {
            return MEAL_TIMES[label] || '';
        }

        function getFilteredMeals(day) {
            if (!day || !day.meals) return [];
            return day.meals
                .filter(m => MEAL_ORDER.includes(m.label))
                .sort((a, b) => MEAL_ORDER.indexOf(a.label) - MEAL_ORDER.indexOf(b.label));
        }

        function getProductsForMeal(meal) {
            if (!meal || !meal.products || !Array.isArray(meal.products)) return [];
            return meal.products.map(p => p.trim()).filter(p => p);
        }

        // ===== TOAST =====
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== RENDER =====
        function renderDay(index) {
            if (!menuData) return;

            const dayKey = getDayKey(index);
            const day = menuData[dayKey];
            if (!day) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <span class="icon">📂</span>
                        Нет данных для этого дня
                    </div>
                `;
                return;
            }

            const todayIndex = getTodayIndex();
            const isToday = index === todayIndex;
            const total = getDayTotal(day);
            const meals = getFilteredMeals(day);

            if (currentMealIndex >= meals.length) {
                currentMealIndex = 0;
            }

            const container = document.getElementById('content');
            const currentMeal = meals[currentMealIndex] || meals[0];
            const currentTime = currentMeal ? getMealTime(currentMeal.label) : '';
            const currentProducts = currentMeal ? getProductsForMeal(currentMeal) : [];

            let html = `
                <div class="header">
                    <div class="header-left">
                        <div class="day-name">
                            ${DAY_NAMES[dayKey]}
                            ${isToday ? '<span class="today-badge">⭐ Сегодня</span>' : ''}
                        </div>
                        <div class="day-total">🔥 ${total} ккал</div>
                        <!-- ПРОДУКТЫ ТЕКУЩЕГО БЛЮДА — ВЕРТИКАЛЬНО, ПОЛУПРОЗРАЧНЫЕ, БЕЗ ФОНА -->
                        ${currentProducts.length > 0 ? `
                            <div class="header-products">
                                ${currentProducts.map(p => `<span class="product-tag">${p}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="header-right">
                        <div class="header-time">${currentTime}</div>
                    </div>
                </div>
            `;

            if (meals.length === 0) {
                html += `
                    <div style="text-align:center;padding:30px;color:#8a9a88;">
                        <div style="font-size:48px;margin-bottom:12px;">🍽️</div>
                        Нет приёмов пищи
                    </div>
                    <div class="day-nav">
                        <button class="day-nav-btn" onclick="changeDay(-1)">‹</button>
                        <span class="day-label">${DAY_NAMES[dayKey]}</span>
                        <button class="day-nav-btn" onclick="changeDay(1)">›</button>
                    </div>
                `;
                container.innerHTML = html;
                currentDayIndex = index;
                return;
            }

            html += `
                <div class="slider-container" id="sliderContainer">
                    <div class="slider-track" id="sliderTrack">
            `;

            meals.forEach((m, idx) => {
                const img = m.image || '';
                const lbl = m.label;
                const t = getMealTime(lbl);
                const isSn = lbl === 'Перекус' || lbl === 'Полдник';
                const kc = parseKcal(m.kcal);
                const br = m.bread || '';

                html += `
                    <div class="slider-slide" data-index="${idx}">
                        <div class="meal-card">
                            ${img ? `<img src="${img}" class="meal-image" alt="${lbl}" onerror="this.className='meal-image empty';this.alt='🖼️'">` : `<div class="meal-image empty">🖼️</div>`}
                            <div class="meal-body">
                                <div class="meal-header">
                                    <span class="meal-label${isSn ? ' snack' : ''}">${lbl}</span>
                                </div>
                                <div class="meal-text">${m.text}</div>
                                <div class="meal-bottom">
                                    <span class="meal-kcal">🔥 ${kc} ккал</span>
                                    ${br ? `<span class="meal-bread">${br}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="slider-dots" id="sliderDots">
            `;

            meals.forEach((_, idx) => {
                html += `<button class="slider-dot${idx === currentMealIndex ? ' active' : ''}" data-index="${idx}"></button>`;
            });

            html += `
                </div>

                <div class="day-nav">
                    <button class="day-nav-btn" onclick="changeDay(-1)">‹</button>
                    <span class="day-label">
                        ${DAY_NAMES[dayKey]}
                    </span>
                    <button class="day-nav-btn" onclick="changeDay(1)">›</button>
                </div>
            `;

            container.innerHTML = html;
            currentDayIndex = index;

            initSlider(meals.length);
        }

        // ===== SLIDER =====
        function initSlider(totalSlides) {
            const track = document.getElementById('sliderTrack');
            const dots = document.querySelectorAll('.slider-dot');

            if (!track || totalSlides <= 1) {
                if (track) track.style.transform = 'translateX(0)';
                return;
            }

            dots.forEach(dot => {
                dot.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    goToSlide(index);
                });
            });

            let startX = 0;
            let isDragging = false;
            let currentTranslate = 0;
            let startTranslate = 0;

            const getTranslate = () => {
                const style = window.getComputedStyle(track);
                const matrix = style.transform;
                if (matrix === 'none') return 0;
                const values = matrix.match(/matrix.*\((.+)\)/);
                if (values) {
                    const nums = values[1].split(', ');
                    return parseFloat(nums[4]) || 0;
                }
                return 0;
            };

            const setTranslate = (x) => {
                const maxTranslate = 0;
                const minTranslate = -(totalSlides - 1) * 100;
                const clamped = Math.max(minTranslate, Math.min(maxTranslate, x));
                track.style.transform = `translateX(${clamped}%)`;
                currentTranslate = clamped;
            };

            const snapToSlide = () => {
                const slideWidth = 100;
                const ratio = Math.round(-currentTranslate / slideWidth);
                const targetIndex = Math.max(0, Math.min(totalSlides - 1, ratio));
                goToSlide(targetIndex);
            };

            track.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                startTranslate = currentTranslate || getTranslate();
                track.style.cursor = 'grabbing';
                track.style.transition = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                const deltaX = ((e.clientX - startX) / track.offsetWidth) * 100;
                setTranslate(startTranslate + deltaX);
                e.preventDefault();
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    track.style.cursor = 'grab';
                    track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    snapToSlide();
                }
            });

            let touchStartX = 0;
            let touchStartTranslate = 0;

            track.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartTranslate = currentTranslate || getTranslate();
                track.style.transition = 'none';
            }, { passive: true });

            track.addEventListener('touchmove', function(e) {
                const touch = e.touches[0];
                const deltaX = ((touch.clientX - touchStartX) / track.offsetWidth) * 100;
                setTranslate(touchStartTranslate + deltaX);
            }, { passive: true });

            track.addEventListener('touchend', function() {
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                snapToSlide();
            }, { passive: true });

            window.addEventListener('resize', function() {
                goToSlide(currentMealIndex, false);
            });

            setTimeout(() => {
                goToSlide(currentMealIndex, false);
            }, 50);
        }

        function goToSlide(index, animate = true) {
            const track = document.getElementById('sliderTrack');
            const dots = document.querySelectorAll('.slider-dot');

            if (!track) return;

            const totalSlides = dots.length;
            if (totalSlides === 0) return;

            const clampedIndex = Math.max(0, Math.min(totalSlides - 1, index));
            currentMealIndex = clampedIndex;

            if (!animate) {
                track.style.transition = 'none';
            } else {
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            }

            const translateX = -clampedIndex * 100;
            track.style.transform = `translateX(${translateX}%)`;
            currentTranslate = translateX;

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === clampedIndex);
            });

            // обновляем продукты и время в шапке
            const meals = getFilteredMeals(menuData[getDayKey(currentDayIndex)]);
            if (meals && meals[clampedIndex]) {
                const meal = meals[clampedIndex];
                const timeStr = getMealTime(meal.label);
                const products = getProductsForMeal(meal);

                const headerTime = document.querySelector('.header .header-time');
                if (headerTime) headerTime.textContent = timeStr;

                // обновляем список продуктов в шапке
                const productsContainer = document.querySelector('.header-products');
                if (productsContainer) {
                    if (products.length > 0) {
                        productsContainer.innerHTML = products.map(p => `<span class="product-tag">${p}</span>`).join('');
                    } else {
                        productsContainer.innerHTML = '';
                    }
                }
            }

            if (!animate) {
                setTimeout(() => {
                    track.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                }, 50);
            }
        }

        // ===== NAVIGATION =====
        function changeDay(delta) {
            const newIndex = (currentDayIndex + delta + 7) % 7;
            currentMealIndex = 0;
            renderDay(newIndex);
        }

        // ===== LOAD MENU =====
        function loadMenu() {
            const container = document.getElementById('content');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Загрузка меню...</div>
                </div>
            `;

            fetch('menu_data.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    let menuDataRaw = data;
                    if (data.menu && data.menu.rows) {
                        const rows = data.menu.rows;
                        const converted = {};
                        rows.forEach(row => {
                            const label = row.label;
                            row.cells.forEach((cell, idx) => {
                                const dayKey = DAY_ORDER[idx];
                                if (!converted[dayKey]) {
                                    converted[dayKey] = { meals: [] };
                                }
                                converted[dayKey].meals.push({
                                    label: label,
                                    text: cell.dish || '',
                                    image: cell.photo || '',
                                    kcal: cell.products.reduce((sum, p) => sum + (p.cal || 0), 0),
                                    products: cell.products.map(p => p.name || '')
                                });
                            });
                        });
                        menuData = converted;
                    } else if (data.rows) {
                        const rows = data.rows;
                        const converted = {};
                        rows.forEach(row => {
                            const label = row.label;
                            row.cells.forEach((cell, idx) => {
                                const dayKey = DAY_ORDER[idx];
                                if (!converted[dayKey]) {
                                    converted[dayKey] = { meals: [] };
                                }
                                converted[dayKey].meals.push({
                                    label: label,
                                    text: cell.dish || '',
                                    image: cell.photo || '',
                                    kcal: cell.products.reduce((sum, p) => sum + (p.cal || 0), 0),
                                    products: cell.products.map(p => p.name || '')
                                });
                            });
                        });
                        menuData = converted;
                    } else {
                        menuData = data;
                    }

                    currentDayIndex = getTodayIndex();
                    currentMealIndex = 0;
                    renderDay(currentDayIndex);
                    showToast('✅ Меню загружено');
                })
                .catch((err) => {
                    console.error('Error:', err);
                    container.innerHTML = `
                        <div class="error">
                            <span class="icon">📂</span>
                            Не удалось загрузить файл <strong>menu_data.json</strong><br>
                            <small style="color:#6b7a6a;display:block;margin-top:8px;">
                                Ошибка: ${err.message}
                            </small>
                            <br>
                            <button onclick="loadMenu()" style="padding:6px 20px;border:none;border-radius:30px;background:#1f4a1e;color:#fff;cursor:pointer;font-size:15px;margin-top:8px;">🔄 Попробовать снова</button>
                        </div>
                    `;
                });
        }

        // ===== KEYBOARD =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                const dots = document.querySelectorAll('.slider-dot');
                if (dots.length > 1) {
                    const newIndex = Math.max(0, currentMealIndex - 1);
                    goToSlide(newIndex);
                } else {
                    changeDay(-1);
                }
            } else if (e.key === 'ArrowRight') {
                const dots = document.querySelectorAll('.slider-dot');
                if (dots.length > 1) {
                    const newIndex = Math.min(dots.length - 1, currentMealIndex + 1);
                    goToSlide(newIndex);
                } else {
                    changeDay(1);
                }
            }
        });

        // ===== INIT =====
        loadMenu();
    </script>
</body>
