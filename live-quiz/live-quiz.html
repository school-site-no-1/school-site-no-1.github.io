<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; }
    .layout { display: flex; height: 100vh; }
    .stage { flex: 1; position: relative; display: flex;
             align-items: center; justify-content: center; background: #000; }
    .stage img { max-width: 90%; max-height: 90%; }
    .reactions { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .reaction { position: absolute; bottom: 0; font-size: 32px;
                animation: fly 3s ease-out forwards; }
    @keyframes fly {
      0%   { transform: translateY(0) scale(.8); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateY(-420px) scale(1.4) rotate(20deg); opacity: 0; }
    }
    .side { width: 340px; background: #1a1a1a; display: flex; flex-direction: column; }
    .chat { flex: 1; overflow-y: auto; padding: 12px; }
    .msg  { margin-bottom: 8px; font-size: 14px; line-height: 1.35; }
    .msg b { color: #4fc3f7; }
    .input-row { display: flex; padding: 8px; gap: 6px; border-top: 1px solid #333; }
    .input-row input { flex: 1; padding: 8px; border-radius: 6px;
                       border: 1px solid #333; background: #222; color: #fff; }
    .input-row button { padding: 8px 12px; border-radius: 6px; border: 0;
                        background: #4fc3f7; color: #000; font-weight: 600; cursor: pointer; }
    .reaction-bar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #333; }
    .reaction-bar button { font-size: 22px; background: none; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="stage">
      <img id="question" src="https://placehold.co/800x600?text=Question" alt="Вопрос" />
      <div class="reactions" id="reactions"></div>
    </div>

    <div class="side">
      <div class="chat" id="chat"></div>
      <div class="reaction-bar" id="reaction-bar">
        <button data-emoji="❤️">❤️</button>
        <button data-emoji="🔥">🔥</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="👍">👍</button>
      </div>
      <form class="input-row" id="form">
        <input id="nickname" placeholder="Имя" value="" maxlength="20" style="max-width:90px" />
        <input id="text" placeholder="Ваш ответ..." maxlength="300" autocomplete="off" />
        <button type="submit">→</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
