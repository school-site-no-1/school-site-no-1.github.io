<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                 background: #000; color: #fff;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* === Стили фона вопроса === */
    .stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
    .stage .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(40px) brightness(0.1) saturate(0.5);
      transform: scale(1.2);
      display: block; pointer-events: none;
    }
    .stage .fg {
      position: relative;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }

    .online {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      z-index: 50;
      font-size: 14px; font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      pointer-events: none; white-space: nowrap;
    }

    .reactions-stats {
      position: fixed;
      top: calc(42px + env(safe-area-inset-top));
      right: 8px;
      font-size: 15px; font-weight: 700;
      line-height: 1.7;
      z-index: 25;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      display: none; pointer-events: none;
    }
    .reactions-stats.visible { display: block; }

    .reactions-stats .title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff; font-weight: 700;
      text-align: right;
      margin-bottom: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
    }

    .reactions-stats .row {
      display: flex; justify-content: flex-end; gap: 8px;
      white-space: nowrap;
    }
    .reactions-stats .row b { color: #4fc3f7; }
    .reactions-stats .row .emoji { color: #FFD54F; }

    .reactions { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
    .reaction {
      position: absolute; bottom: 0; font-size: 34px;
      animation: fly 3s ease-out forwards; will-change: transform, opacity;
    }
    @keyframes fly {
      0% { transform: translateY(0) scale(.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-70vh) scale(1.5) rotate(20deg); opacity: 0; }
    }

    .chat-overlay {
      position: fixed; left: 0; right: 0; bottom: 20px; height: 62.5vh;
      display: flex; flex-direction: column;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,0) 100%);
      z-index: 20; padding-bottom: env(safe-area-inset-bottom); pointer-events: none;
    }
    .chat-overlay > * { pointer-events: auto; }

    .chat {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      display: flex; flex-direction: column; gap: 4px; scrollbar-width: none;
    }
    .chat::-webkit-scrollbar { display: none; }

    .msg {
      font-size: 14px; line-height: 1.35; background: rgba(0,0,0,.35);
      padding: 5px 10px; border-radius: 12px; align-self: flex-start; max-width: 92%;
      white-space: pre-wrap; word-break: break-word;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .msg .hide-btn { background: none; border: 0; color: #ff5252; font-size: 14px;
                     margin-left: 6px; cursor: pointer; padding: 0 4px; }

    .msg.system-msg {
      background: rgba(79, 195, 247, .15);
      border-left: 3px solid #4fc3f7;
      font-style: italic;
      color: #b3e5fc;
      align-self: flex-start;
    }

    .reaction-bar { display: flex; justify-content: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
    .reaction-bar button {
      width: 48px; height: 48px; font-size: 26px; background: rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.15); border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .1s;
      color: #fff;
    }
    .reaction-bar button:active { transform: scale(.9); }

    .reaction-bar button[data-emoji="67"] {
      font-size: 18px; font-weight: 700; color: #FFD54F;
    }

    .input-row {
      display: flex; gap: 6px;
      padding: 8px 10px 10px;
      align-items: flex-end;
      position: relative;
    }
    .input-row textarea {
      background: rgba(20,20,20,.75); border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; color: #fff; padding: 10px 12px; font-size: 16px;
      font-family: inherit; outline: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .input-row textarea::placeholder { color: rgba(255,255,255,.5); }

    #text { flex: 1; resize: none; max-height: 90px; line-height: 1.35; }
    .input-row button[type=submit] {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 0;
      background: #4fc3f7; color: #000; font-size: 20px; font-weight: 700; cursor: pointer;
    }
    .input-row button[type=submit]:disabled { opacity: .4; }

    .char-counter {
      position: absolute; right: 60px; bottom: 14px;
      font-size: 11px; color: rgba(255,255,255,.5);
      pointer-events: none; background: rgba(0,0,0,.4);
      padding: 2px 6px; border-radius: 8px; z-index: 5;
    }
    .char-counter.warn { color: #ffb74d; }
    .char-counter.danger { color: #ff5252; }

    .stats {
      position: fixed; top: calc(180px + env(safe-area-inset-top)); right: 8px;
      max-width: 200px; max-height: 30vh; overflow-y: auto;
      background: rgba(0,0,0,.7); border-radius: 10px; padding: 8px 10px;
      font-size: 12px; line-height: 1.4; z-index: 25; display: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .stats.visible { display: block; }
    .stats b { color: #4fc3f7; }

    .mod-actions {
      position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 12px;
      display: none; flex-direction: row; flex-wrap: wrap; gap: 6px;
      max-width: calc(100vw - 120px); z-index: 26;
    }
    .mod-actions.visible { display: flex; }
    .mod-actions button {
      background: rgba(0,0,0,.75); color: #fff; border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap;
    }
    .mod-actions button:active { transform: scale(.97); }

    .mod-prompt {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .mod-prompt.visible { display: flex; }
    .mod-prompt .box { background: #222; padding: 16px; border-radius: 12px; width: 280px; }
    .mod-prompt input {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px;
      border: 1px solid #444; background: #111; color: #fff; margin-bottom: 10px;
    }
    .mod-prompt button {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 0;
      background: #4fc3f7; color: #000; font-weight: 700;
    }

    /* =======================================================
       === СТИЛИ ДЛЯ ОВЕРЛЕЯ ВЫБОРА (УМЕНЬШЕНО В 2 РАЗА) ===
       ======================================================= */
    #quizOverlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
      z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; transition: opacity 0.4s ease;
    }
    
    /* На широких экранах прижимаем блок вправо */
    @media (min-width: 768px) {
      #quizOverlay {
        align-items: flex-end;
        padding-right: 8%;
        background: transparent;
      }
    }

    #quizOverlay.hidden { opacity: 0; pointer-events: none; }
    
    .quiz-content { 
      width: 100%; 
      max-width: 240px; /* Уменьшено в 2 раза (было 400px) */
      background: rgba(15, 15, 20, 0.85);
      padding: 12px; /* Уменьшено */
      border-radius: 12px; /* Уменьшено */
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .screen { display: none; animation: fadeIn .22s ease; width: 100%; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .grid { display: grid; gap: 6px; } /* Уменьшено */
    #classesGrid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); } /* Уменьшено */
    #subjectsGrid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); } /* Уменьшено */

    .quiz-btn {
      font: inherit; cursor: pointer; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.05); color: #fff; border-radius: 6px; /* Уменьшено */
      padding: 8px 6px; /* Уменьшено */
      transition: all .15s ease; user-select: none;
      font-size: 14px; /* Уменьшено (было 22px) */
      font-weight: 700; text-align: center;
    }
    .quiz-btn:hover { border-color: #4fc3f7; color: #4fc3f7; transform: translateY(-1px); background: rgba(255,255,255,.1); }
    .quiz-btn:active { transform: translateY(1px); }
    
    #subjectsGrid .quiz-btn { 
      text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 400; /* Уменьшено */
    }

    /* Смайлы */
    .smiles {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center;
      padding: 10px 0; min-height: 60px; /* Уменьшено */
    }
    .smile {
      font-size: 40px; /* Уменьшено (было 70px) */
      line-height: 1; padding: 5px; border-radius: 12px;
      border: none; background: transparent; box-shadow: none;
      transition: transform .18s ease, filter .18s ease; animation: smileIn .25s ease both;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .smile:hover { transform: translateY(-4px) scale(1.05); filter: drop-shadow(0 8px 16px rgba(59, 110, 246, 0.3)); }
    @keyframes smileIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    .smiles.single .smile { display: none; }
    .smiles.single .smile.active {
      display: block; background: transparent;
      animation: popIn .4s cubic-bezier(.34, 1.56, .64, 1) both;
      pointer-events: none;
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.3); }
      60%  { opacity: 1; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1.2); }
    }

      { name: "Бражников А.П.", subjectClasses: { "Физ-ра": ["6В","3В","5А","5Б","6Б"], "ОБЗР": ["8А","8Б","8В","9А","9Б","9В","10А","10Б","11А","11Б"], "Труд": ["7А","7Б","7В"] } },
      { name: "Харитонова А.М.", subjectClasses: { "ИЗО": ["1А","1Б","1В","2А","2Б","2В","3А","3Б","3В","4А","4Б","4В","5А","5Б","6А","6Б","6В","7А","7Б","7В"] } },
      { name: "Степанова О.С.", subjectClasses: { "Музыка": ["1А","1Б","1В","2А","2Б","2В","3А","3Б","3В","4А","4Б","4В","5А","5Б","6А","6Б","6В","7А","7Б","7В","8А","8Б","8В"] } },
      { name: "Пыркова Л.С.", subjectClasses: { "Разговор о важном": ["11А"], "Россия-мои горизонты": ["11А","11Б"], "Проф.ориентация": ["10А"], "Психология": [], "Вн.история/психолог": ["11А"] } },
      { name: "Клюева Н.Н.", subjectClasses: { "Разговор о важном": ["6Б"], "Россия-мои горизонты": ["6А","6Б","6В","9А","9Б","9В"] } },
      { name: "Хикматова А.А.", subjectClasses: { "Разговор о важном": ["11Б"], "Россия-мои горизонты": ["8А","8Б","8В","10А","10Б"] } },
      { name: "Михалицын А.В.", subjectClasses: { "Информатика": ["10А","10Б","11А","11Б","9В","9А"], "Англ/информатика": ["7А","7Б","7В","8А","8Б","8В","9Б"], "Вн.по информатике": ["9А","9Б","9В","10Б","11Б"], "Вн.химия/информатика": ["10Б","11Б"], "Физика": ["7А","7Б","7В","8А","8Б","8В","9А","9Б","9В"] } },
      { name: "Пырков П.М.", subjectClasses: { "Труд": ["6А","6Б","6В"] } },
      { name: "Трофимова О.В.", subjectClasses: { "Физика": ["10А","10Б","11А","11Б"], "Вн. по физике": ["10Б","11Б"] } }
    ];

    function collectClasses() {
      const set = new Set();
      TEACHERS.forEach(t => {
        Object.values(t.subjectClasses).forEach(arr => {
          arr.forEach(cls => {
            const num = parseInt(cls, 10);
            if (num >= 5 && num <= 11) set.add(num);
          });
        });
      });
      return [...set].sort((a, b) => a - b);
    }

    function collectSubjects(classNum) {
      const set = new Set();
      TEACHERS.forEach(t => {
        Object.entries(t.subjectClasses).forEach(([subject, classes]) => {
          const hasClass = classes.some(c => parseInt(c, 10) === classNum);
          if (hasClass) set.add(subject);
        });
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ru"));
    }

    const CLASSES = collectClasses();
    const state = { classNum: null, subject: null, smile: null };

    const classesGrid = document.getElementById("classesGrid");
    const subjectsGrid = document.getElementById("subjectsGrid");
    const smilesGrid = document.getElementById("smilesGrid");
    const quizOverlay = document.getElementById("quizOverlay");

    const screens = {
      classes: document.getElementById("screenClasses"),
      subjects: document.getElementById("screenSubjects"),
      smiles: document.getElementById("screenSmiles")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function resetSmiles() {
      smilesGrid.classList.remove("single");
      [...smilesGrid.children].forEach(b => b.classList.remove("active"));
      state.smile = null;
    }

    function renderClasses() {
      classesGrid.innerHTML = "";
      CLASSES.forEach(num => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.textContent = num;
        btn.dataset.cls = num;
        btn.addEventListener("click", () => selectClass(num));
        classesGrid.appendChild(btn);
      });
    }

    function selectClass(num) {
      state.classNum = num;
      state.subject = null;
      const subjects = collectSubjects(num);
      subjectsGrid.innerHTML = "";
      
      subjects.forEach(sub => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.textContent = sub;
        btn.dataset.sub = sub;
        btn.addEventListener("click", () => selectSubject(sub));
        subjectsGrid.appendChild(btn);
      });
      showScreen("subjects");
    }

    function selectSubject(sub) {
      state.subject = sub;
      resetSmiles();
      showScreen("smiles");
    }

    renderClasses();

    smilesGrid.addEventListener("click", async (e) => {
      const btn = e.target.closest(".smile");
      if (!btn) return;
      if (smilesGrid.classList.contains("single")) return;

      state.smile = btn.dataset.value;
      btn.classList.add("active");
      smilesGrid.classList.add("single");

      setTimeout(async () => {
        quizOverlay.classList.add("hidden");
        
        const smileLabels = { good: "😀", neutral: "😐", bad: "😞" };
        const emoji = smileLabels[state.smile];
        const resultText = `${state.subject} ${emoji}`;

        try {
          const { data, error } = await db.from('answers').insert({
            room: ROOM,
            nickname: 'Аноним',
            gender: null,
            text: resultText,
            original_text: resultText,
            ai_answer: null,
            ai_question: null,
            is_private: false,
            question_id: QUESTION_ID,
            day: todayMoscow()
          }).select().single();

          if (!error && data) {
            addMessageToChat(data);
          }
        } catch (err) {
          console.error("Ошибка отправки оценки:", err);
        }
      }, 500);
    });


    // =====================================================================
    // ==== ЧАСТЬ 2. ИНИЦИАЛИЗАЦИЯ ЧАТА ====
    // =====================================================================
    const SUPABASE_URL  = 'https://wwspemquprfjggytfhno.supabase.co';
    const SUPABASE_KEY  = 'sb_publishable_KGg69p8Px9QaJt80DgKaag_zvWdE_aE';
    const ROOM          = 'live-1';
    const QUESTION_ID   = 'q1';
    const MAX_LEN       = 150;
    const DEEPSEEK_PROXY = 'https://deepseek-proxy.a-mikhalitsyn.workers.dev';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function todayMoscow() {
      const now = new Date();
      const moscow = new Date(now.getTime() + (3 * 60 * 60 * 1000));
      return moscow.toISOString().slice(0, 10);
    }

    async function fetchWithTimeout(url, options, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        return response;
      } catch (error) {
        clearTimeout(timer);
        if (error.name === 'AbortError') { console.warn('Таймаут ' + timeoutMs + ' мс'); return null; }
        throw error;
      }
    }

    async function callTranslate(text, gender, mode, nickname) {
      try {
        const response = await fetchWithTimeout(DEEPSEEK_PROXY + '/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, gender, mode, nickname })
        }, 20000);

        if (!response || !response.ok) return null;
        const data = await response.json();
        return data.translated || null;
      } catch (error) { console.error('Сетевая ошибка:', error); return null; }
    }

    const chatEl      = document.getElementById('chat');
    const reactionsEl = document.getElementById('reactions');
    const form        = document.getElementById('form');
    const textEl      = document.getElementById('text');
    const onlineEl    = document.getElementById('online');
    const statsEl     = document.getElementById('stats');
    const statsReactEl = document.getElementById('reactions-stats');
    const charCounterEl = document.getElementById('char-counter');
    const submitBtn   = form.querySelector('button[type=submit]');

    const isModerator = new URLSearchParams(location.search).get('mod') === '1';
    let modPassword   = null;
    const reactionCounts = {};

    function autoGrow() {
      textEl.style.height = 'auto';
      textEl.style.height = Math.min(textEl.scrollHeight, 90) + 'px';
      updateCharCounter();
    }

    function updateCharCounter() {
      const len = textEl.value.length;
      charCounterEl.textContent = len + '/' + MAX_LEN;
      charCounterEl.classList.remove('warn', 'danger');
      if (len >= MAX_LEN) charCounterEl.classList.add('danger');
      else if (len > MAX_LEN - 25) charCounterEl.classList.add('warn');
    }

    textEl.addEventListener('input', () => {
      if (textEl.value.length > MAX_LEN) textEl.value = textEl.value.slice(0, MAX_LEN);
      autoGrow();
    });

    textEl.addEventListener('paste', (e) => {
      const pasted = (e.clipboardData || window.clipboardData).getData('text');
      if (textEl.value.length + pasted.length > MAX_LEN) {
        e.preventDefault();
        textEl.value += pasted.slice(0, MAX_LEN - textEl.value.length);
        updateCharCounter();
      }
    });

    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    updateCharCounter();

    async function loadQuestion() {
      const { data, error } = await db.from('questions').select('*').eq('id', QUESTION_ID).single();
      if (error || !data) { console.error(error); return; }
      document.getElementById('question').src    = data.image_url;
      document.getElementById('question-bg').src = data.image_url;
    }

    db.channel('questions-watch').on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'questions', filter: 'id=eq.' + QUESTION_ID },
      (payload) => {
        document.getElementById('question').src    = payload.new.image_url;
        document.getElementById('question-bg').src = payload.new.image_url;
      }
    ).subscribe();

    async function loadHistory() {
      const { data, error } = await db.from('answers').select('*')
        .eq('room', ROOM).eq('hidden', false).eq('day', todayMoscow())
        .order('created_at', { ascending: true }).limit(200);

      if (error) { console.error('Ошибка загрузки:', error); return; }
      data.forEach(addMessageToChat);
    }

    const channel = db.channel('room:' + ROOM)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'answers', filter: 'room=eq.' + ROOM }, (payload) => {
        const row = payload.new;
        if (row.day !== todayMoscow()) return;
        if (row.is_private) return;
        addMessageToChat(row);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'answers', filter: 'room=eq.' + ROOM }, (payload) => {
        if (payload.new.hidden && payload.new.day === todayMoscow()) removeMessage(payload.new.id);
      })
      .on('broadcast', { event: 'reaction' }, ({ payload }) => spawnReaction(payload.emoji))
      .subscribe(status => console.log('Realtime status:', status));

    db.channel('reactions-watch').on('postgres_changes',
      { event: '*', schema: 'public', table: 'reactions_count', filter: 'room=eq.' + ROOM },
      (payload) => {
        const row = payload.new || payload.old;
        if (row && row.day === todayMoscow()) updateReactionCounter(row.emoji, row.cnt);
      }
    ).subscribe();

    function addMessageToChat(row) {
      if (row.hidden) return;
      if (document.querySelector('[data-id="' + row.id + '"]')) return;

      const div = document.createElement('div');
      div.dataset.id = row.id;

      div.className = 'msg';
      div.innerHTML = escapeHtml(row.text).replace(/\n/g, '<br>');

      if (isModerator) {
        const btn = document.createElement('button');
        btn.className = 'hide-btn';
        btn.textContent = '✕';
        btn.onclick = () => hideMessage(row.id);
        div.appendChild(btn);
      }

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeMessage(id) {
      const el = document.querySelector('[data-id="' + id + '"]');
      if (el) el.remove();
    }

    async function hideMessage(id) {
      const pwd = await getModPassword();
      if (!pwd) return;
      const { error } = await db.rpc('hide_answer', { answer_id: id, password: pwd });
      if (error) { alert(error.message); modPassword = null; return; }
      removeMessage(id);
    }

    async function getModPassword() {
      if (!modPassword) modPassword = await askPassword();
      return modPassword;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const originalText = textEl.value.trim();
      if (!originalText) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '…';

      const isQuestion = /[?]|^(что|как|почему|зачем|когда|где|кто|какой|какая|какие|сколько)/i.test(originalText);
      let aiAnswer = null;
      let finalText = originalText;

      if (isQuestion) {
        const answer = await callTranslate(originalText, null, 'question', '');
        if (answer) {
          aiAnswer = answer;
          finalText = '❓ ' + originalText + '\n' + answer;
        }
      }

      const { data, error } = await db.from('answers').insert({
        room: ROOM,
        nickname: 'Аноним',
        gender: null,
        text: finalText,
        original_text: originalText,
        ai_answer: aiAnswer,
        ai_question: null,
        is_private: false,
        question_id: QUESTION_ID,
        day: todayMoscow()
      }).select().single();

      submitBtn.disabled = false; submitBtn.textContent = '➤';

      if (error) { console.error('Ошибка Supabase:', error); alert('Ошибка: ' + error.message); return; }

      addMessageToChat(data);
      textEl.value = '';
      autoGrow(); updateCharCounter(); textEl.focus();
    });

    document.querySelectorAll('#reaction-bar button').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const emoji = btn.dataset.emoji;
        spawnReaction(emoji);
        await db.rpc('bump_reaction', { p_room: ROOM, p_emoji: emoji });
        channel.send({ type: 'broadcast', event: 'reaction', payload: { emoji } });
      });
    });

    function spawnReaction(emoji) {
      const el = document.createElement('span');
      el.className = 'reaction';
      el.textContent = emoji;
      el.style.left = Math.random() * 80 + 10 + '%';
      reactionsEl.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function renderReactionsStats() {
      const emojis = Object.keys(reactionCounts);
      if (emojis.length === 0) { statsReactEl.classList.remove('visible'); return; }

      emojis.sort((a, b) => reactionCounts[b] - reactionCounts[a]);
      const rowsHtml = emojis.map(e => '<div class="row"><span class="emoji">' + e + '</span><b>' + reactionCounts[e] + '</b></div>').join('');

      statsReactEl.innerHTML = '<div class="title">Сегодня</div>' + rowsHtml;
      statsReactEl.classList.add('visible');
    }

    function updateReactionCounter(emoji, cnt) {
      reactionCounts[emoji] = cnt;
      renderReactionsStats();
    }

    async function loadReactionCounts() {
      const { data, error } = await db.from('reactions_count').select('*').eq('room', ROOM).eq('day', todayMoscow());
      if (error || !data) return;

      Object.keys(reactionCounts).forEach(k => delete reactionCounts[k]);
      data.forEach(row => { reactionCounts[row.emoji] = row.cnt; });
      renderReactionsStats();
    }

    let visitLogged = false;
    const presence = db.channel('presence:' + ROOM, { config: { presence: { key: crypto.randomUUID() } } });

    presence
      .on('presence', { event: 'sync' }, async () => {
        const state = presence.presenceState();
        const count = Object.keys(state).length;
        onlineEl.textContent = 'Онлайн: ' + count;
        try { await db.rpc('bump_online', { p_room: ROOM, p_current_online: count }); } catch (e) {}
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presence.track({ joined_at: Date.now() });
          if (!visitLogged) {
            visitLogged = true;
            try {
              const state = presence.presenceState();
              await db.rpc('visit_room', { p_room: ROOM, p_current_online: Object.keys(state).length });
            } catch (e) {}
          }
        }
      });

    async function refreshStats() {
      const { data, error } = await db.rpc('answer_stats', { p_room: ROOM });
      if (error || !data) return;
      statsEl.innerHTML = '<b>Топ ответов</b><br>' + data.map(r => escapeHtml(r.answer_text) + ' — <b>' + r.cnt + '</b>').join('<br>');
    }

    if (isModerator) {
      statsEl.classList.add('visible');
      document.getElementById('mod-actions').classList.add('visible');
      setInterval(refreshStats, 3000);
      refreshStats();

      document.getElementById('new-question').addEventListener('click', async () => {
        const url = prompt('URL картинки вопроса:', document.getElementById('question').src);
        if (!url) return;
        const pwd = await getModPassword();
        if (!pwd) return;
        const { error } = await db.rpc('new_question_image', { q_id: QUESTION_ID, new_url: url, password: pwd });
        if (error) { alert(error.message); return; }
        document.getElementById('question').src    = url;
        document.getElementById('question-bg').src = url;
      });
    }

    function askPassword() {
      return new Promise(resolve => {
        const modal = document.getElementById('mod-prompt');
        const input = document.getElementById('mod-password');
        const cancel = document.getElementById('mod-cancel');
        modal.classList.add('visible');
        input.value = '';
        input.focus();

        function cleanup() {
          modal.classList.remove('visible');
          input.removeEventListener('keydown', onKey);
          cancel.removeEventListener('click', onCancel);
        }
        function onKey(e) {
          if (e.key === 'Enter') { const v = input.value; cleanup(); resolve(v); }
          if (e.key === 'Escape') { cleanup(); resolve(null); }
        }
        function onCancel() { cleanup(); resolve(null); }
        input.addEventListener('keydown', onKey);
        cancel.addEventListener('click', onCancel);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function msUntilMidnightMoscow() {
      const now = new Date();
      const moscow = new Date(now.getTime() + (3 * 60 * 60 * 1000));
      const midnight = new Date(moscow);
      midnight.setHours(24, 0, 0, 0);
      return midnight.getTime() - moscow.getTime();
    }

    function scheduleReset() {
      const ms = msUntilMidnightMoscow();
      setTimeout(() => {
        chatEl.innerHTML = '';
        loadHistory();
        loadReactionCounts();
        scheduleReset();
      }, ms);
    }
    scheduleReset();

    loadQuestion();
    loadHistory();
    loadReactionCounts();
  </script>
</body>
