<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000" />
  <title>Остановись на минуту. Что сегодня стало понятнее?</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                 background: #000; color: #fff;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
    .stage .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(40px) brightness(0.1) saturate(0.5);
      transform: scale(1.2);
      display: block; pointer-events: none;
    }
    .stage .fg {
      position: relative;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }

    .online {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      z-index: 50;
      font-size: 14px; font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      pointer-events: none; white-space: nowrap;
    }

    .reactions-stats {
      position: fixed;
      top: calc(42px + env(safe-area-inset-top));
      right: 8px;
      font-size: 15px; font-weight: 700;
      line-height: 1.7;
      z-index: 25;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      display: none; pointer-events: none;
    }
    .reactions-stats.visible { display: block; }

    .reactions-stats .title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff; font-weight: 700;
      text-align: right;
      margin-bottom: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
    }

    .reactions-stats .row {
      display: flex; justify-content: flex-end; gap: 8px;
      white-space: nowrap;
    }
    .reactions-stats .row b { color: #4fc3f7; }
    .reactions-stats .row .emoji { color: #FFD54F; }

    .reactions { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
    .reaction {
      position: absolute; bottom: 0; font-size: 34px;
      animation: fly 3s ease-out forwards; will-change: transform, opacity;
    }
    @keyframes fly {
      0% { transform: translateY(0) scale(.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-70vh) scale(1.5) rotate(20deg); opacity: 0; }
    }

    .chat-overlay {
      position: fixed; left: 0; right: 0; bottom: 0; height: 62.5vh;   /* было 50vh — увеличено на 25% */
      display: flex; flex-direction: column;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,0) 100%);
      z-index: 20; padding-bottom: env(safe-area-inset-bottom); pointer-events: none;
    }
    .chat-overlay > * { pointer-events: auto; }

    .chat {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      display: flex; flex-direction: column; gap: 4px; scrollbar-width: none;
    }
    .chat::-webkit-scrollbar { display: none; }

    .msg {
      font-size: 14px; line-height: 1.35; background: rgba(0,0,0,.35);
      padding: 5px 10px; border-radius: 12px; align-self: flex-start; max-width: 92%;
      white-space: pre-wrap; word-break: break-word;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .msg b { color: #4fc3f7; }
    .msg .hide-btn { background: none; border: 0; color: #ff5252; font-size: 14px;
                     margin-left: 6px; cursor: pointer; padding: 0 4px; }

    /* Системное сообщение (приветствие от нейронки) */
    .msg.system-msg {
      background: rgba(79, 195, 247, .15);
      border-left: 3px solid #4fc3f7;
      font-style: italic;
      color: #b3e5fc;
      align-self: flex-start;
    }

    .reaction-bar { display: flex; justify-content: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
    .reaction-bar button {
      width: 48px; height: 48px; font-size: 26px; background: rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.15); border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .1s;
      color: #fff;
    }
    .reaction-bar button:active { transform: scale(.9); }

    .reaction-bar button[data-emoji="67"] {
      font-size: 18px; font-weight: 700; color: #FFD54F;
    }

    .input-row {
      display: flex; gap: 6px;
      padding: 8px 10px 10px;
      align-items: flex-end;
      position: relative;
    }
    .input-row input, .input-row textarea {
      background: rgba(20,20,20,.75); border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; color: #fff; padding: 10px 12px; font-size: 16px;
      font-family: inherit; outline: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .input-row input::placeholder, .input-row textarea::placeholder { color: rgba(255,255,255,.5); }
    #nickname { width: 90px; flex: 0 0 auto; }

    #gender {
      width: 44px; flex: 0 0 auto;
      background: rgba(20,20,20,.75);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      color: #fff;
      padding: 10px 4px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      text-align: center;
      text-align-last: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    #gender option { background: #222; color: #fff; }

    #text { flex: 1; resize: none; max-height: 90px; line-height: 1.35; }
    .input-row button[type=submit] {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 0;
      background: #4fc3f7; color: #000; font-size: 20px; font-weight: 700; cursor: pointer;
    }
    .input-row button[type=submit]:disabled { opacity: .4; }

    .char-counter {
      position: absolute; right: 60px; bottom: 14px;
      font-size: 11px; color: rgba(255,255,255,.5);
      pointer-events: none; background: rgba(0,0,0,.4);
      padding: 2px 6px; border-radius: 8px; z-index: 5;
    }
    .char-counter.warn { color: #ffb74d; }
    .char-counter.danger { color: #ff5252; }

    .stats {
      position: fixed; top: calc(180px + env(safe-area-inset-top)); right: 8px;
      max-width: 200px; max-height: 30vh; overflow-y: auto;
      background: rgba(0,0,0,.7); border-radius: 10px; padding: 8px 10px;
      font-size: 12px; line-height: 1.4; z-index: 25; display: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .stats.visible { display: block; }
    .stats b { color: #4fc3f7; }

    .mod-actions {
      position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 12px;
      display: none; flex-direction: row; flex-wrap: wrap; gap: 6px;
      max-width: calc(100vw - 120px); z-index: 26;
    }
    .mod-actions.visible { display: flex; }
    .mod-actions button {
      background: rgba(0,0,0,.75); color: #fff; border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap;
    }
    .mod-actions button:active { transform: scale(.97); }

    .mod-prompt {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .mod-prompt.visible { display: flex; }
    .mod-prompt .box { background: #222; padding: 16px; border-radius: 12px; width: 280px; }
    .mod-prompt input {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px;
      border: 1px solid #444; background: #111; color: #fff; margin-bottom: 10px;
    }
    .mod-prompt button {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 0;
      background: #4fc3f7; color: #000; font-weight: 700;
    }
  </style>

  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();

        if (document.scripts[j].src === r) { return; }
      }
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=110291320', 'ym');

  <noscript><div><img src="https://mc.yandex.ru/watch/110291320" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
</head>
<body>

  <div class="stage">
    <img class="bg" id="question-bg" src="" alt="" />
    <img class="fg" id="question"    src="" alt="" />
  </div>

  <div class="online" id="online">Онлайн: 1</div>
  <div class="reactions" id="reactions"></div>
  <div class="reactions-stats" id="reactions-stats"></div>
  <div class="stats" id="stats"></div>

  <div class="mod-actions" id="mod-actions">
    <button id="new-question">❓ Вопрос</button>
  </div>

  <div class="chat-overlay">
    <div class="chat" id="chat"></div>

    <div class="reaction-bar" id="reaction-bar">
      <button data-emoji="❤️">❤️</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="👍">👍</button>
      <button data-emoji="😮">😮</button>
      <button data-emoji="67">67</button>
    </div>

    <form class="input-row" id="form">
      <input    id="nickname" placeholder="Имя" maxlength="20" autocomplete="off" />
      <select   id="gender" title="Пол">
        <option value="">—</option>
        <option value="male">♂</option>
        <option value="female">♀</option>
      </select>
      <textarea id="text"     placeholder="Ваш ответ..." maxlength="150" rows="1" autocomplete="off"></textarea>
      <span class="char-counter" id="char-counter">0/150</span>
      <button type="submit">➤</button>
    </form>
  </div>

  <div class="mod-prompt" id="mod-prompt">
    <div class="box">
      <div style="margin-bottom:10px;">Пароль модератора:</div>
      <input id="mod-password" type="password" />
      <button id="mod-cancel" style="background:#444;color:#fff;margin-top:6px;">Отмена</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
