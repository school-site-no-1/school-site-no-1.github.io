<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000" />
  <title>Остановись на минуту. Что сегодня стало понятнее?</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                 background: #000; color: #fff;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
    .stage .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(40px) brightness(0.1) saturate(0.5);
      transform: scale(1.2);
      display: block; pointer-events: none;
    }
    .stage .fg {
      position: relative;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }

    :root {
      --line1-shift: 40px;
      --line2-shift: 20px;
    }
    .line-1 { transform: translateY(var(--line1-shift)); }
    .line-2 { transform: translateY(var(--line2-shift)); }

    .online {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      z-index: 50;
      font-size: 14px; font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      pointer-events: none; white-space: nowrap;
    }

    /* Статистика реакций */
    .reactions-stats {
      position: fixed;
      top: calc(42px + env(safe-area-inset-top));
      right: 8px;
      font-size: 15px; font-weight: 700;
      line-height: 1.7;
      z-index: 25;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
      display: none; pointer-events: none;
    }
    .reactions-stats.visible { display: block; }

    .reactions-stats .title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff; font-weight: 700;
      text-align: right;
      margin-bottom: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,.9);
    }

    .reactions-stats .row {
      display: flex; justify-content: flex-end; gap: 8px;
      white-space: nowrap;
    }
    .reactions-stats .row b { color: #4fc3f7; }
    .reactions-stats .row .emoji { color: #FFD54F; }

    /* Летящие эмодзи */
    .reactions { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
    .reaction {
      position: absolute; bottom: 0; font-size: 34px;
      animation: fly 3s ease-out forwards; will-change: transform, opacity;
    }
    @keyframes fly {
      0% { transform: translateY(0) scale(.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-70vh) scale(1.5) rotate(20deg); opacity: 0; }
    }

    /* Панель реакций (без поля ввода) */
    .reaction-bar-wrapper {
      position: fixed; left: 0; right: 0; bottom: 20px;
      display: flex; justify-content: center;
      z-index: 20; padding-bottom: env(safe-area-inset-bottom); 
      pointer-events: none;
    }
    .reaction-bar { 
      display: flex; justify-content: center; gap: 8px; padding: 10px 16px; flex-wrap: wrap; 
      background: rgba(0,0,0,.4); border-radius: 30px; backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); pointer-events: auto;
    }
    .reaction-bar button {
      width: 48px; height: 48px; font-size: 26px; background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15); border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s; color: #fff;
    }
    .reaction-bar button:active { transform: scale(.9); }

    .reaction-bar button[data-emoji="67"] {
      font-size: 18px; font-weight: 700; color: #FFD54F;
    }

    /* Модераторские кнопки */
    .mod-actions {
      position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 12px;
      display: none; flex-direction: row; flex-wrap: wrap; gap: 6px;
      max-width: calc(100vw - 120px); z-index: 26;
    }
    .mod-actions.visible { display: flex; }
    .mod-actions button {
      background: rgba(0,0,0,.75); color: #fff; border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap;
    }
    .mod-actions button:active { transform: scale(.97); }

    /* Модалка пароля */
    .mod-prompt {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .mod-prompt.visible { display: flex; }
    .mod-prompt .box { background: #222; padding: 16px; border-radius: 12px; width: 280px; }
    .mod-prompt input {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px;
      border: 1px solid #444; background: #111; color: #fff; margin-bottom: 10px;
    }
    .mod-prompt button {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 0;
      background: #4fc3f7; color: #000; font-weight: 700;
    }
  </style>

  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for (var j = 0; j < document.scripts.length; j++) {
        if (document.scripts[j].src === r) { return; }
      }
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=110291320', 'ym');

    ym(110291320, 'init', {
      ssr: true, webvisor: true, clickmap: true,

      accurateTrackBounce: true, trackLinks: true
    });
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/110291320" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
</head>
<body>

  <div class="stage">
    <img class="bg" id="question-bg" src="" alt="" />
    <img class="fg" id="question"    src="" alt="" />
  </div>

  <div class="online" id="online">Онлайн: 1</div>
  <div class="reactions" id="reactions"></div>
  <div class="reactions-stats" id="reactions-stats"></div>

  <div class="mod-actions" id="mod-actions">
    <button id="new-question">❓ Вопрос</button>
  </div>

  <!-- Панель реакций -->
  <div class="reaction-bar-wrapper">
    <div class="reaction-bar" id="reaction-bar">
      <button data-emoji="❤️">❤️</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="👍">👍</button>
      <button data-emoji="😮">😮</button>
      <button data-emoji="67">67</button>
    </div>
  </div>

  <div class="mod-prompt" id="mod-prompt">
    <div class="box">
      <div style="margin-bottom:10px;">Пароль модератора:</div>
      <input id="mod-password" type="password" />
      <button id="mod-cancel" style="background:#444;color:#fff;margin-top:6px;">Отмена</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
