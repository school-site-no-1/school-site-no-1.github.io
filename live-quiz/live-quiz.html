          arr.forEach(cls => {
            const num = parseInt(cls, 10);
            if (num >= 5 && num <= 11) set.add(num);
          });
        });
      });
      return [...set].sort((a, b) => a - b);
    }

    function collectSubjects(classNum) {
      const set = new Set();
      TEACHERS.forEach(t => {
        Object.entries(t.subjectClasses).forEach(([subject, classes]) => {
          const hasClass = classes.some(c => parseInt(c, 10) === classNum);
          if (hasClass) set.add(subject);
        });
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ru"));
    }

    const CLASSES = collectClasses();
    const state = { classNum: null, subject: null, smile: null };

    const classesGrid = document.getElementById("classesGrid");
    const subjectsGrid = document.getElementById("subjectsGrid");
    const smilesGrid = document.getElementById("smilesGrid");
    const quizOverlay = document.getElementById("quizOverlay");

    const screens = {
      classes: document.getElementById("screenClasses"),
      subjects: document.getElementById("screenSubjects"),
      smiles: document.getElementById("screenSmiles")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function resetSmiles() {
      smilesGrid.classList.remove("single");
      [...smilesGrid.children].forEach(b => b.classList.remove("active"));
      state.smile = null;
    }

    function renderClasses() {
      classesGrid.innerHTML = "";
      CLASSES.forEach(num => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.textContent = num;
        btn.dataset.cls = num;
        btn.addEventListener("click", () => selectClass(num));
        classesGrid.appendChild(btn);
      });
    }

    function selectClass(num) {
      state.classNum = num;
      state.subject = null;
      const subjects = collectSubjects(num);
      subjectsGrid.innerHTML = "";

      subjects.forEach(sub => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.textContent = sub;
        btn.dataset.sub = sub;
        btn.addEventListener("click", () => selectSubject(sub));
        subjectsGrid.appendChild(btn);
      });
      showScreen("subjects");
    }

    function selectSubject(sub) {
      state.subject = sub;
      resetSmiles();
      showScreen("smiles");
    }

    renderClasses();

    // ==== Сохранение оценки (смайла) в answers ====
    smilesGrid.addEventListener("click", async (e) => {
      const btn = e.target.closest(".smile");
      if (!btn) return;
      if (smilesGrid.classList.contains("single")) return;

      state.smile = btn.dataset.value;
      btn.classList.add("active");
      smilesGrid.classList.add("single");

      setTimeout(async () => {
        quizOverlay.classList.add("hidden");

        const smileLabels = { good: "😀", neutral: "😐", bad: "😞" };
        const emoji = smileLabels[state.smile];
        const resultText = `${state.subject} ${emoji}`;

        try {
          const { error } = await db.from('answers').insert({
            room: ROOM,
            nickname: 'Аноним',
            gender: null,
            text: resultText,
            original_text: resultText,
            ai_answer: null,
            ai_question: null,
            is_private: false,
            question_id: QUESTION_ID,
            day: todayMoscow()
          });
          if (error) console.error("Ошибка сохранения оценки:", error);
        } catch (err) {
          console.error("Ошибка отправки оценки:", err);
        }
      }, 500);
    });


    // =====================================================================
    // ==== ЧАСТЬ 2. ИНИЦИАЛИЗАЦИЯ (вопрос, реакции, онлайн, статистика) ====
    // =====================================================================
    const SUPABASE_URL  = 'https://wwspemquprfjggytfhno.supabase.co';
    const SUPABASE_KEY  = 'sb_publishable_KGg69p8Px9QaJt80DgKaag_zvWdE_aE';
    const ROOM          = 'live-1';
    const QUESTION_ID   = 'q1';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function todayMoscow() {
      const now = new Date();
      const moscow = new Date(now.getTime() + (3 * 60 * 60 * 1000));
      return moscow.toISOString().slice(0, 10);
    }

    const reactionsEl   = document.getElementById('reactions');
    const onlineEl      = document.getElementById('online');
    const statsEl       = document.getElementById('stats');
    const statsReactEl  = document.getElementById('reactions-stats');

    const isModerator = new URLSearchParams(location.search).get('mod') === '1';
    let modPassword   = null;
    const reactionCounts = {};

    // ==== Вопрос ====
    async function loadQuestion() {
      const { data, error } = await db.from('questions').select('*').eq('id', QUESTION_ID).single();
      if (error || !data) { console.error(error); return; }
      document.getElementById('question').src    = data.image_url;
      document.getElementById('question-bg').src = data.image_url;
    }

    db.channel('questions-watch').on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'questions', filter: 'id=eq.' + QUESTION_ID },
      (payload) => {
        document.getElementById('question').src    = payload.new.image_url;
        document.getElementById('question-bg').src = payload.new.image_url;
      }
    ).subscribe();

    // ==== Реакции ====
    const reactionChannel = db.channel('reactions:' + ROOM)
      .on('broadcast', { event: 'reaction' }, ({ payload }) => spawnReaction(payload.emoji))
      .subscribe(status => console.log('Reactions channel:', status));

    document.querySelectorAll('#reaction-bar button').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const emoji = btn.dataset.emoji;
        spawnReaction(emoji);
        await db.rpc('bump_reaction', { p_room: ROOM, p_emoji: emoji });
        reactionChannel.send({ type: 'broadcast', event: 'reaction', payload: { emoji } });
      });
    });

    function spawnReaction(emoji) {
      const el = document.createElement('span');
      el.className = 'reaction';
      el.textContent = emoji;
      el.style.left = Math.random() * 80 + 10 + '%';
      reactionsEl.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function renderReactionsStats() {
      const emojis = Object.keys(reactionCounts);
      if (emojis.length === 0) { statsReactEl.classList.remove('visible'); return; }

      emojis.sort((a, b) => reactionCounts[b] - reactionCounts[a]);
      const rowsHtml = emojis.map(e => '<div class="row"><span class="emoji">' + e + '</span><b>' + reactionCounts[e] + '</b></div>').join('');

      statsReactEl.innerHTML = '<div class="title">Сегодня</div>' + rowsHtml;
      statsReactEl.classList.add('visible');
    }

    function updateReactionCounter(emoji, cnt) {
      reactionCounts[emoji] = cnt;
      renderReactionsStats();
    }

    async function loadReactionCounts() {
      const { data, error } = await db.from('reactions_count').select('*').eq('room', ROOM).eq('day', todayMoscow());
      if (error || !data) return;

      Object.keys(reactionCounts).forEach(k => delete reactionCounts[k]);
      data.forEach(row => { reactionCounts[row.emoji] = row.cnt; });
      renderReactionsStats();
    }

    db.channel('reactions-watch').on('postgres_changes',
      { event: '*', schema: 'public', table: 'reactions_count', filter: 'room=eq.' + ROOM },
      (payload) => {
        const row = payload.new || payload.old;
        if (row && row.day === todayMoscow()) updateReactionCounter(row.emoji, row.cnt);
      }
    ).subscribe();

    // ==== Онлайн (presence) ====
    let visitLogged = false;
    const presence = db.channel('presence:' + ROOM, { config: { presence: { key: crypto.randomUUID() } } });

    presence
      .on('presence', { event: 'sync' }, async () => {
        const state = presence.presenceState();
        const count = Object.keys(state).length;
        onlineEl.textContent = 'Онлайн: ' + count;
        try { await db.rpc('bump_online', { p_room: ROOM, p_current_online: count }); } catch (e) {}
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presence.track({ joined_at: Date.now() });
          if (!visitLogged) {
            visitLogged = true;
            try {
              const state = presence.presenceState();
              await db.rpc('visit_room', { p_room: ROOM, p_current_online: Object.keys(state).length });
            } catch (e) {}
          }
        }
      });

    // ==== Статистика по предметам ====
    // Всем — только сумма. Модератору — с разбивкой 😀/😐/😞.
    async function loadSubjectStats() {
      const { data, error } = await db.rpc('subject_stats', {
        p_room: ROOM,
        p_day: todayMoscow()
      });
      if (error) { console.error('subject_stats:', error); return; }
      renderSubjectStats(data || [], isModerator);
    }

    function renderSubjectStats(rows, detailed) {
      const el = document.getElementById('subject-stats');
      if (!rows.length) {
        el.classList.remove('visible');
        el.innerHTML = '';
        return;
      }

      const totalAll = rows.reduce((s, r) => s + Number(r.total), 0);

      if (detailed) {
        // Модератор: полная таблица
        const body = rows.map(r => `
          <tr>
            <td>${escapeHtml(r.subject)}</td>
            <td class="total">${r.total}</td>
            <td class="g">${r.good}</td>
            <td class="n">${r.neutral}</td>
            <td class="b">${r.bad}</td>
          </tr>
        `).join('');

        el.innerHTML = `
          <b>Голоса по предметам</b>
          <div style="font-size:11px;opacity:.7;margin:2px 0 6px;">Всего: ${totalAll}</div>
          <table>
            <thead>
              <tr>
                <th>Предмет</th>
                <th>Σ</th>
                <th>😀</th>
                <th>😐</th>
                <th>😞</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        `;
      } else {
        // Всем: только сумма
        const body = rows.map(r => `
          <tr>
            <td>${escapeHtml(r.subject)}</td>
            <td class="total">${r.total}</td>
          </tr>
        `).join('');

        el.innerHTML = `
          <b>Голоса по предметам</b>
          <div style="font-size:11px;opacity:.7;margin:2px 0 6px;">Всего: ${totalAll}</div>
          <table>
            <thead>
              <tr>
                <th>Предмет</th>
                <th>Σ</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        `;
      }

      el.classList.add('visible');
    }

    // Показываем панель и грузим статистику для всех
    document.getElementById('subject-stats').classList.add('visible');
    loadSubjectStats();
    setInterval(loadSubjectStats, 5000);

    // ==== Модерация ====
    if (isModerator) {
      document.getElementById('mod-actions').classList.add('visible');

      document.getElementById('new-question').addEventListener('click', async () => {
        const url = prompt('URL картинки вопроса:', document.getElementById('question').src);
        if (!url) return;
        const pwd = await getModPassword();
        if (!pwd) return;
        const { error } = await db.rpc('new_question_image', { q_id: QUESTION_ID, new_url: url, password: pwd });
        if (error) { alert(error.message); return; }
        document.getElementById('question').src    = url;
        document.getElementById('question-bg').src = url;
      });
    }

    async function getModPassword() {
      if (!modPassword) modPassword = await askPassword();
      return modPassword;
    }

    function askPassword() {
      return new Promise(resolve => {
        const modal = document.getElementById('mod-prompt');
        const input = document.getElementById('mod-password');
        const cancel = document.getElementById('mod-cancel');
        modal.classList.add('visible');
        input.value = '';
        input.focus();

        function cleanup() {
          modal.classList.remove('visible');
          input.removeEventListener('keydown', onKey);
          cancel.removeEventListener('click', onCancel);
        }
        function onKey(e) {
          if (e.key === 'Enter') { const v = input.value; cleanup(); resolve(v); }
          if (e.key === 'Escape') { cleanup(); resolve(null); }
        }
        function onCancel() { cleanup(); resolve(null); }
        input.addEventListener('keydown', onKey);
        cancel.addEventListener('click', onCancel);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ==== Автосброс в 00:00 ====
    function msUntilMidnightMoscow() {
      const now = new Date();
      const moscow = new Date(now.getTime() + (3 * 60 * 60 * 1000));
      const midnight = new Date(moscow);
      midnight.setHours(24, 0, 0, 0);
      return midnight.getTime() - moscow.getTime();
    }

    function scheduleReset() {
      const ms = msUntilMidnightMoscow();
      setTimeout(() => {
        loadReactionCounts();
        loadSubjectStats();
        scheduleReset();
      }, ms);
    }
    scheduleReset();

    // ==== Старт ====
    loadQuestion();
    loadReactionCounts();
  </script>
</body>
</html>
