<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111" />
  <title>Архив Live Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    header {
      background: #1a1a1a;
      padding: 16px;
      border-bottom: 1px solid #333;
      position: sticky; top: 0; z-index: 10;
    }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .controls {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .controls label { font-size: 13px; color: #aaa; }
    select, button {
      background: #222; color: #fff;
      border: 1px solid #444; border-radius: 8px;
      padding: 8px 12px; font-size: 14px;
      font-family: inherit; cursor: pointer;
    }
    select { min-width: 160px; }
    button:hover { background: #2a2a2a; }
    button.primary { background: #4fc3f7; color: #000; border-color: #4fc3f7; font-weight: 700; }
    button.primary:hover { background: #39b0e3; }

    main { padding: 16px; max-width: 1200px; margin: 0 auto; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2a2a2a;
    }
    .card h2 {
      margin: 0 0 12px; font-size: 16px;
      color: #4fc3f7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card .meta {
      font-size: 12px; color: #888;
      margin-bottom: 12px;
    }

    /* Статистика эмодзи */
    .stats-row {
      display: flex; justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 16px;
    }
    .stats-row:last-child { border-bottom: 0; }
    .stats-row .emoji { font-size: 20px; }
    .stats-row .cnt { color: #4fc3f7; font-weight: 700; }

    /* Сообщения */
    .msg {
      padding: 10px 12px;
      background: #222;
      border-radius: 10px;
      margin-bottom: 8px;
      border-left: 3px solid #4fc3f7;
    }
    .msg .nick {
      font-weight: 700; color: #4fc3f7;
      font-size: 13px;
    }
    .msg .time {
      font-size: 11px; color: #777;
      margin-left: 8px;
    }
    .msg .original {
      color: #aaa;
      font-size: 13px;
      margin-top: 4px;
      font-style: italic;
    }
    .msg .original::before { content: '→ '; color: #666; }
    .msg .translated {
      margin-top: 4px;
      color: #fff;
      font-size: 15px;
    }
    .msg.hidden-msg {
      opacity: .5;
      border-left-color: #ff5252;
    }
    .msg.hidden-msg .translated::after {
      content: ' (скрыто модератором)';
      color: #ff5252; font-size: 12px;
    }

    /* Итоги */
    .summary {
      display: flex; gap: 20px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .summary-item {
      background: #222;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      min-width: 100px;
    }
    .summary-item .num {
      font-size: 24px; font-weight: 700; color: #4fc3f7;
    }
    .summary-item .label {
      font-size: 12px; color: #888; margin-top: 4px;
    }

    /* Топ ответов */
    .top-item {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .top-item:last-child { border-bottom: 0; }
    .top-item .text {
      flex: 1; word-break: break-word;
    }
    .top-item .cnt {
      color: #4fc3f7; font-weight: 700;
      white-space: nowrap;
    }

    .loader { text-align: center; padding: 40px; color: #888; }
    .empty { text-align: center; padding: 40px; color: #666; }

    /* Кнопка экспорта */
    .export-row {
      display: flex; gap: 8px; margin-top: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 Архив Live Quiz</h1>
    <div class="controls">
      <label for="day-select">День:</label>
      <select id="day-select">
        <option value="">— загрузка —</option>
      </select>
      <button id="refresh" class="primary">🔄 Обновить</button>
      <button id="export-csv">📥 Скачать CSV</button>
    </div>
  </header>

  <main>
    <div id="loader" class="loader">Загрузка...</div>
    <div id="content" style="display:none;">
      <div class="grid">
        <div>
          <!-- Сообщения -->
          <div class="card">
            <h2>Сообщения</h2>
            <div class="meta" id="messages-meta"></div>
            <div id="messages"></div>
          </div>
        </div>
        <div>
          <!-- Итоги -->
          <div class="card">
            <h2>Итоги дня</h2>
            <div class="summary" id="summary"></div>
          </div>

          <!-- Статистика эмодзи -->
          <div class="card">
            <h2>Реакции</h2>
            <div id="reactions"></div>
          </div>

          <!-- Топ ответов -->
          <div class="card">
            <h2>Топ ответов</h2>
            <div id="top-answers"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==== Настройки ====
    const SUPABASE_URL  = 'https://wwspemquprfjggytfhno.supabase.co';
    const SUPABASE_KEY  = 'sb_publishable_KGg69p8Px9QaJt80DgKaag_zvWdE_aE';
    const ROOM          = 'live-1';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==== DOM ====
    const daySelect    = document.getElementById('day-select');
    const refreshBtn   = document.getElementById('refresh');
    const exportBtn    = document.getElementById('export-csv');
    const loader       = document.getElementById('loader');
    const content      = document.getElementById('content');
    const messagesEl   = document.getElementById('messages');
    const messagesMeta = document.getElementById('messages-meta');
    const summaryEl    = document.getElementById('summary');
    const reactionsEl  = document.getElementById('reactions');
    const topAnswersEl = document.getElementById('top-answers');

    // Текущие данные дня — для экспорта
    let currentDay = null;
    let currentAnswers = [];
    let currentReactions = [];

    // ==== Утилиты ====
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatTime(iso) {
      const d = new Date(iso);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return dd + '.' + mm + '.' + yyyy;
    }

    // ==== Загрузка списка дней ====
    async function loadDays() {
      // Собираем уникальные дни из answers и reactions_count
      const { data: answersDays } = await db
        .from('answers')
        .select('day')
        .eq('room', ROOM);

      const { data: reactionsDays } = await db
        .from('reactions_count')
        .select('day')
        .eq('room', ROOM);

      const days = new Set();
      (answersDays || []).forEach(r => r.day && days.add(r.day));
      (reactionsDays || []).forEach(r => r.day && days.add(r.day));

      const sorted = Array.from(days).sort().reverse(); // новые сверху

      daySelect.innerHTML = '';
      if (sorted.length === 0) {
        daySelect.innerHTML = '<option value="">Нет данных</option>';
        loader.textContent = 'Архив пуст — ещё нет ни одного дня с сообщениями.';
        loader.style.display = 'block';
        content.style.display = 'none';
        return;
      }

      sorted.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = formatDate(d);
        daySelect.appendChild(opt);
      });

      // Загружаем первый (самый свежий) день
      await loadDay(sorted[0]);
    }

    // ==== Загрузка конкретного дня ====
    async function loadDay(day) {
      if (!day) return;
      currentDay = day;

      loader.style.display = 'block';
      loader.textContent = 'Загрузка данных за ' + formatDate(day) + '...';
      content.style.display = 'none';

      // Сообщения
      const { data: answers, error: errA } = await db
        .from('answers')
        .select('*')
        .eq('room', ROOM)
        .eq('day', day)
        .order('created_at', { ascending: true });

      if (errA) {
        loader.textContent = 'Ошибка загрузки сообщений: ' + errA.message;
        return;
      }

      // Реакции
      const { data: reactions, error: errR } = await db
        .from('reactions_count')
        .select('*')
        .eq('room', ROOM)
        .eq('day', day)
        .order('cnt', { ascending: false });

      currentAnswers = answers || [];
      currentReactions = reactions || [];

      renderMessages(answers || []);
      renderSummary(answers || [], reactions || []);
      renderReactions(reactions || []);
      renderTopAnswers(answers || []);

      loader.style.display = 'none';
      content.style.display = 'block';
    }

    // ==== Отрисовка сообщений ====
    function renderMessages(answers) {
      const visible = answers.filter(a => !a.hidden).length;
      const hidden = answers.length - visible;

      messagesMeta.textContent =
        'Всего: ' + answers.length +
        ' · видимых: ' + visible +
        (hidden > 0 ? ' · скрытых: ' + hidden : '');

      if (answers.length === 0) {
        messagesEl.innerHTML = '<div class="empty">Нет сообщений за этот день.</div>';
        return;
      }

      messagesEl.innerHTML = answers.map(a => {
        const original = a.original_text
          ? '<div class="original">' + escapeHtml(a.original_text) + '</div>'
          : '';
        const translated = '<div class="translated">' + escapeHtml(a.text) + '</div>';
        const cls = a.hidden ? 'msg hidden-msg' : 'msg';

        return '<div class="' + cls + '">' +
                 '<div><span class="nick">' + escapeHtml(a.nickname) + '</span>' +
                 '<span class="time">' + formatTime(a.created_at) + '</span></div>' +
                 original +
                 translated +
               '</div>';
      }).join('');
    }

    // ==== Итоги дня ====
    function renderSummary(answers, reactions) {
      const visible = answers.filter(a => !a.hidden).length;
      const totalReactions = reactions.reduce((s, r) => s + Number(r.cnt), 0);
      const uniqueNicks = new Set(answers.map(a => a.nickname)).size;

      summaryEl.innerHTML =
        '<div class="summary-item"><div class="num">' + answers.length + '</div><div class="label">Сообщений</div></div>' +
        '<div class="summary-item"><div class="num">' + visible + '</div><div class="label">Видимых</div></div>' +
        '<div class="summary-item"><div class="num">' + uniqueNicks + '</div><div class="label">Участников</div></div>' +
        '<div class="summary-item"><div class="num">' + totalReactions + '</div><div class="label">Реакций</div></div>';
    }

    // ==== Реакции ====
    function renderReactions(reactions) {
      if (reactions.length === 0) {
        reactionsEl.innerHTML = '<div class="empty">Реакций не было.</div>';
        return;
      }

      reactionsEl.innerHTML = reactions.map(r =>
        '<div class="stats-row">' +
          '<span class="emoji">' + escapeHtml(r.emoji) + '</span>' +
          '<span class="cnt">' + r.cnt + '</span>' +
        '</div>'
      ).join('');
    }

    // ==== Топ ответов ====
    function renderTopAnswers(answers) {
      const visible = answers.filter(a => !a.hidden);

      if (visible.length === 0) {
        topAnswersEl.innerHTML = '<div class="empty">Нет видимых ответов.</div>';
        return;
      }

      // Считаем по original_text (что писал зритель) — без учёта регистра
      const counts = {};
      visible.forEach(a => {
        const key = (a.original_text || a.text || '').toLowerCase().trim();
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
      });

      const sorted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15);

      if (sorted.length === 0) {
        topAnswersEl.innerHTML = '<div class="empty">Нет данных.</div>';
        return;
      }

      topAnswersEl.innerHTML = sorted.map(([text, cnt]) =>
        '<div class="top-item">' +
          '<div class="text">' + escapeHtml(text) + '</div>' +
          '<div class="cnt">' + cnt + '</div>' +
        '</div>'
      ).join('');
    }

    // ==== Экспорт CSV ====
    function exportCSV() {
      if (!currentAnswers.length) {
        alert('Нет данных для экспорта за этот день.');
        return;
      }

      // CSV-заголовки
      const headers = ['ID', 'Время', 'Имя', 'Оригинал', 'Пересказ', 'Скрыто'];

      const rows = currentAnswers.map(a => [
        a.id,
        formatTime(a.created_at),
        a.nickname,
        a.original_text || '',
        a.text || '',
        a.hidden ? 'да' : 'нет'
      ]);

      // Экранирование для CSV
      const escapeCSV = (val) => {
        const s = String(val).replace(/"/g, '""');
        return '"' + s + '"';
      };

      const csv = [
        headers.map(escapeCSV).join(','),
        ...rows.map(r => r.map(escapeCSV).join(','))
      ].join('\n');

      // BOM для корректного открытия в Excel с русскими буквами
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'archive-' + currentDay + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ==== Обработчики ====
    daySelect.addEventListener('change', () => loadDay(daySelect.value));
    refreshBtn.addEventListener('click', () => loadDay(daySelect.value || currentDay));
    exportBtn.addEventListener('click', exportCSV);

    // ==== Старт ====
    loadDays();
  </script>
</body>
</html>
