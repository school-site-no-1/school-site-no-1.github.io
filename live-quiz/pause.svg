<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Остановись на минуту. Что сегодня стало понятнее?">
  <defs>
    <!-- Фон -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Свечение вокруг текста (верхняя часть) -->
    <radialGradient id="glow-top" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Размытие для свечения иконок -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Основной фон -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow-top)"/>

  <!-- Декоративные звезды (точки) -->
  <g fill="#e2e8f0" opacity="0.4">
    <circle cx="90" cy="120" r="2"/>
    <circle cx="160" cy="210" r="1.5"/>
    <circle cx="250" cy="90" r="1.8"/>
    <circle cx="620" cy="140" r="2"/>
    <circle cx="700" cy="230" r="1.5"/>
    <circle cx="560" cy="70" r="1.8"/>
    <circle cx="120" cy="760" r="1.6"/>
    <circle cx="680" cy="820" r="1.8"/>
    <circle cx="730" cy="650" r="1.4"/>
    <circle cx="70" cy="560" r="1.5"/>
  </g>

  <!-- Концентрические круги (волны спокойствия) - центрированы на иконке паузы -->
  <g fill="none" stroke="#93c5fd" stroke-opacity="0.08">
    <circle cx="400" cy="650" r="120"/>
    <circle cx="400" cy="650" r="180"/>
    <circle cx="400" cy="650" r="240"/>
  </g>

  <!-- ТЕКСТ В САМОМ ВЕРХУ -->

  <!-- Заголовок: "Остановись на минуту." -->
  <text x="400" y="120" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
    Остановись на минуту.
  </text>

  <!-- Разделительная линия между текстами -->
  <line x1="350" y1="170" x2="450" y2="170"
        stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Подзаголовок: "Что сегодня стало понятнее?" -->
  <text x="400" y="240" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" fill="#94a3b8" letter-spacing="0.2">
    Что сегодня стало понятнее?
  </text>


  <!-- ИКОНКА ПАУЗЫ НИЖЕ ТЕКСТА -->
  
  <!-- Свечение позади паузы -->
  <g filter="url(#soft)" fill="#60a5fa" opacity="0.5">
    <rect x="370" y="610" width="18" height="80" rx="9"/>
    <rect x="412" y="610" width="18" height="80" rx="9"/>
  </g>
  
  <!-- Сама иконка паузы -->
  <g fill="#f8fafc">
    <rect x="370" y="610" width="18" height="80" rx="9"/>
    <rect x="412" y="610" width="18" height="80" rx="9"/>
  </g>

  <!-- Нижняя подпись (остается внизу для баланса) -->
  <text x="400" y="900" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#475569" letter-spacing="4">
    ПАУЗА · ДЫХАНИЕ · ЯСНОСТЬ
  </text>
</svg>