<!DOCTYPE html>
<html lang="ru" data-version="v4.5.6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание 5-11 (плитки + перемены)</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2b6cb0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <style>
        /* ============================
           БАЗОВЫЕ СТИЛИ
           ============================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            /* Платиново-серый фон */
            background: #E5E4E2;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            min-height: 100dvh;
            align-items: stretch;
            padding: 4px;
        }

        .container {
            height: calc(100vh - 8px);
            min-height: calc(100vh - 8px);
            height: calc(100dvh - 8px);
            min-height: calc(100dvh - 8px);
            padding: 8px;
            border-radius: 12px;
            background: #EFEEEC;
            display: flex;
            flex-direction: column;
            border: 1px solid #B8B8B3;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }

        /* ============================
           ШАПКА
           ============================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #B8B8B3;
            flex-wrap: nowrap;
            gap: 8px;
            min-height: 44px;
            flex-shrink: 0;
        }
        .header-left { display: none !important; }
        .header-banner { display: none !important; }
        .mobile-banner-text { display: none !important; }

        .header-center {
            display: flex !important;
            align-items: center;
            flex: 1 1 auto;
        }
        .header-center .day-indicator { display: none !important; }
        .header-center .divider { display: none !important; }

        .period {
            color: #e65100;
            font-weight: 600;
            min-height: 1.6em;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 15px;
            line-height: 1.3;
        }
        .period .line1 { font-size: 15px; display: block; }
        .period .line2 { font-size: 13px; display: block; font-weight: 500; color: #d45c00; }

        .header-right {
            text-align: right;
            display: flex !important;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
        }

        /* ============================
           ЧАСЫ (из clock.js)
           ============================ */
        #clockContainer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        #clockContainer .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0px;
        }
        #clockContainer .clock-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #clockContainer svg {
            width: 36px;
            height: 36px;
        }
        #clockContainer .clock-text {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            white-space: nowrap;
        }
        #clockContainer .clock-text .digital-time {
            font-size: 18px;
            color: #2b6cb0;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }
        #clockContainer .clock-text .day {
            display: block !important;
            font-size: 9px;
            color: #4a5568;
            font-weight: 600;
            line-height: 1.2;
        }
        #clockContainer .clock-text .day .day-name {
            color: #2b6cb0;
            font-weight: 700;
        }
        #clockContainer .clock-date-row { display: none !important; }

        /* ============================
           МОБИЛЬНЫЕ КОНТРОЛЫ (фильтр классов)
           ============================ */
        .mobile-controls {
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 12px;
            margin: 0 0 6px;
            border: 1px solid #B8B8B3;
            border-radius: 8px;
            background: #F5F4F2;
            color: #1a365d;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .mobile-controls label { min-width: 0; font-size: 14px; }
        .mobile-controls select {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 36px;
            padding: 6px 10px;
            border: 1px solid #2b6cb0;
            border-radius: 6px;
            background: #ffffff;
            color: #1a365d;
            font: inherit;
            font-size: 14px;
        }
        .mobile-controls select:focus-visible {
            outline: 3px solid #f6ad55;
            outline-offset: 2px;
        }

        /* ============================
           ПЛИТОЧНАЯ СЕТКА РАСПИСАНИЯ
           ============================ */
        .tiles-view {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 2px 0;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .tiles-view::-webkit-scrollbar { width: 6px; }
        .tiles-view::-webkit-scrollbar-thumb {
            background: #B8B8B3;
            border-radius: 3px;
        }

        /* Заголовок класса */
        .tiles-class-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            background: #D6D5D2;
            color: #1a365d;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #2b6cb0;
            margin-top: 4px;
            flex-shrink: 0;
        }

        /* Ряд плиток с уроками */
        .tiles-row {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            align-items: stretch;
            transition: background 0.15s;
        }
        .tiles-row.current-lesson-row {
            background: #bee3f8;
            box-shadow: 0 0 0 2px #3182ce inset;
            border-radius: 6px;
        }

        /* Блок с номером урока */
        .tile-number {
            flex: 0 0 34px;
            min-width: 34px;
            max-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #4a5568;
            background: #F5F4F2;
            border-radius: 6px;
            border: 1px solid #B8B8B3;
            padding: 2px;
        }
        .tiles-row.current-lesson-row .tile-number {
            background: #90cdf4;
            color: #1a365d;
            border-color: #63b3ed;
        }

        /* ==========================================
           ПЛИТКА ПРЕДМЕТА
           Верхняя строка: предмет (слева) + время (справа)
           Нижняя строка: кабинет
           ========================================== */
        .tile-subject {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #B8B8B3;
            background: #ffffff;
            text-align: left;
            overflow: hidden;
            line-height: 1.2;
            min-height: 44px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .tiles-row.current-lesson-row .tile-subject {
            border-color: #63b3ed;
            box-shadow: 0 2px 6px rgba(43, 108, 176, 0.10);
        }

        /* Верхняя строка: предмет + время на одной строке */
        .tile-subject .subject-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            margin-bottom: 1px;
        }
        .tile-subject .subject-name {
            font-weight: 600;
            font-size: 15px;
            color: #2d3748;
            display: block;
            text-align: left;
            line-height: 1.25;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            flex: 1 1 auto;
            min-width: 0;
        }
        .tile-subject .lesson-meta {
            font-weight: 600;
            font-size: 10px;
            color: #718096;
            display: block;
            white-space: nowrap;
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            text-align: right;
        }

        /* Кабинет — под предметом, слева */
        .tile-subject .subject-room {
            font-weight: 700;
            font-size: 11px;
            color: #9a3412;
            display: block;
            text-align: left;
            margin-top: 1px;
            white-space: nowrap;
        }

        /* Пустая плитка */
        .tile-subject.empty-tile {
            background: #F5F4F2;
            border: 1px dashed #B8B8B3;
            box-shadow: none;
        }
        .tile-subject.empty-tile .subject-name {
            color: #a0aec0;
            font-weight: 400;
            font-style: italic;
        }
        .tile-subject.empty-tile .lesson-meta {
            color: #a0aec0;
        }

        /* ==========================================
           СТАТУСБАР ПЕРЕМЕНЫ
           Высота уменьшена в 2 раза.
           Цвет как у шапки (.tiles-class-header #D6D5D2),
           но светлее — #E9E8E6.
           Правый статус не выходит за границу.
           ========================================== */
        .tiles-break-row {
            display: flex;
            gap: 0;
            flex-shrink: 0;
            /* Высота уменьшена в 2 раза: было 11px → стало 5–6px */
            min-height: 6px;
            /* Цвет как у шапки, но светлее */
            background: #E9E8E6;
            border: 1px solid #DAD9D6;
            border-radius: 4px;
            box-shadow: none;
            align-items: stretch;
            margin: 0;
            overflow: hidden; /* чтобы прогресс-полоса не вылезала */
            position: relative;
            transition: opacity 0.2s;
        }
        .tiles-break-row .break-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            /* Прогресс-полоса — чуть темнее фона перемены */
            background: rgba(148, 163, 184, 0.45);
            width: 0%;
            transition: width 0.5s linear;
            pointer-events: none;
            z-index: 0;
            border-radius: 0;
        }
        .break-label { display: none !important; }
        .break-content {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            background: transparent;
            border: none;
            border-radius: 0;
            color: #4a5568;
            font-weight: 600;
            font-size: 9px;
            gap: 4px;
            flex-wrap: nowrap;
            z-index: 1;
            line-height: 1;
            overflow: hidden;
        }
        .break-content .break-left {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 1;
        }
        .break-content .break-title { display: none !important; }
        .break-content .break-time {
            font-weight: 600;
            color: #718096;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-size: 8px;
        }
        .break-content .break-right {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 1;
            min-width: 0;
            overflow: hidden;
            justify-content: flex-end;
        }
        .break-content .break-duration {
            font-weight: 700;
            color: #4a5568;
            background: transparent;
            padding: 0 2px;
            border: none;
            border-radius: 0;
            white-space: nowrap;
            font-size: 8px;
            flex-shrink: 0;
        }
        .break-content .break-status {
            font-size: 8px;
            font-weight: 700;
            background: transparent;
            padding: 0 2px;
            border: none;
            border-radius: 0;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .break-content .break-status.status-past {
            color: #a0aec0;
        }
        .break-content .break-status.status-now {
            color: #7A7A75;
            animation: pulse-break 1.4s ease-in-out infinite;
        }
        .break-content .break-status.status-future {
            color: #4a5568;
        }
        @keyframes pulse-break {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Текущая перемена — фон как у перемены, прогресс темнее */
        .tiles-break-row.current-break-row {
            background: #E9E8E6;
            box-shadow: none;
        }
        .tiles-break-row.current-break-row .break-progress {
            background: rgba(122, 122, 117, 0.45);
        }

        /* Прошедшая перемена — приглушённая */
        .tiles-break-row.past-break-row {
            opacity: 0.55;
            background: #E9E8E6;
            box-shadow: none;
        }
        .tiles-break-row.past-break-row .break-content { color: #a0aec0; }
        .tiles-break-row.past-break-row .break-progress {
            background: rgba(184, 184, 179, 0.45);
        }

        /* ============================
           ПОДВАЛ
           ============================ */
        .footer {
            flex-shrink: 0;
            margin-top: 4px;
            color: #7A7A75;
            text-align: center;
            border-top: 1px solid #B8B8B3;
            padding-top: 4px;
            font-size: 12px;
        }
        .footer .version { font-weight: 600; color: #4a5568; }

        .board-sync {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #276749;
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 12px;
            padding: 1px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.25;
        }
        .board-sync::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }
        .board-sync.loading {
            color: #975a16;
            background: #fffaf0;
            border-color: #fbd38d;
        }
        .board-sync.offline {
            color: #c53030;
            background: #fff5f5;
            border-color: #feb2b2;
        }

        /* ============================
           ЗАГРУЗКА
           ============================ */
        .loading-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #4a5568;
            font-weight: 300;
            flex-direction: column;
            gap: 6px;
        }
        .loading-overlay .sub { font-size: 0.6em; color: #a0aec0; }

        /* ============================
           УВЕДОМЛЕНИЕ
           ============================ */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(450px);
            transition: transform 0.3s;
            z-index: 3000;
            color: #2d3748;
            max-width: 400px;
        }
        .notification.show { transform: translateX(0); }
        .notification.success { border-left: 4px solid #38a169; }
        .notification.error { border-left: 4px solid #e53e3e; }
        .notification.info { border-left: 4px solid #2b6cb0; }
        .notification.warning { border-left: 4px solid #d69e2e; }

        /* ============================
           PWA
           ============================ */
        #pwaNotification {
            display: none;
            background: #ebf8ff;
            border: 1px solid #2b6cb0;
            border-radius: 8px;
            padding: 8px 14px;
            margin: 4px 0;
            text-align: center;
        }
        #pwaNotification p { margin: 0; color: #2b6cb0; font-size: 0.85rem; }
        #pwaNotification .small { font-size: 0.75rem; }

        /* ============================
           ДОСТУПНОСТЬ
           ============================ */
        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
        .skip-link {
            position: fixed;
            z-index: 1000;
            top: 8px;
            left: 8px;
            padding: 10px 14px;
            background: #1a365d;
            color: #ffffff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            transform: translateY(-160%);
            transition: transform 0.2s ease;
        }
        .skip-link:focus {
            transform: translateY(0);
            outline: 3px solid #f6ad55;
            outline-offset: 2px;
        }

        /* ============================
           АДАПТИВНОСТЬ
           ============================ */
        @media (max-width: 400px) {
            .container { padding: 4px; border-radius: 8px; }
            .period { font-size: 13px; }
            .period .line1 { font-size: 13px; }
            .period .line2 { font-size: 11px; }
            #clockContainer svg { width: 28px; height: 28px; }
            #clockContainer .clock-text .digital-time { font-size: 15px; }
            #clockContainer .clock-text .day { font-size: 8px !important; }
            .tiles-class-header { font-size: 12px; padding: 4px 8px; }
            .tile-number { flex: 0 0 26px; min-width: 26px; max-width: 26px; font-size: 11px; }
            .tile-subject { padding: 4px 6px; min-height: 38px; }
            .tile-subject .subject-name { font-size: 13px; }
            .tile-subject .lesson-meta { font-size: 8px; }
            .tile-subject .subject-room { font-size: 10px; }
            /* Высота перемены уменьшена в 2 раза: 10px → 5px */
            .tiles-break-row { min-height: 5px; }
            .break-content { font-size: 8px; padding: 0 5px; }
            .break-content .break-time { font-size: 7px; }
            .break-content .break-duration { font-size: 7px; padding: 0 1px; }
            .break-content .break-status { font-size: 7px; padding: 0 1px; }
            .mobile-controls { padding: 4px 8px; font-size: 12px; }
            .mobile-controls select { font-size: 12px; min-height: 30px; padding: 4px 6px; }
            .footer { font-size: 10px; }
        }

        @media (max-width: 350px) {
            #clockContainer .clock-text .digital-time { font-size: 13px; }
            #clockContainer .clock-text .day { font-size: 7px !important; }
            #clockContainer svg { width: 24px; height: 24px; }
            .break-content .break-duration { display: none; }
            .tile-subject .lesson-meta { font-size: 7px; }
        }

        /* ============================
           ПЕЧАТЬ
           ============================ */
        @media print {
            .no-print { display: none !important; }
            body, html { background: white !important; overflow: visible !important; }
            .container { border: none !important; box-shadow: none !important; background: white !important; }
            .tiles-view { overflow: visible !important; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#mainContent">Перейти к расписанию</a>
    <div class="container">
        <!-- ===== ШАПКА ===== -->
        <header class="header">
            <h1 class="visually-hidden">Расписание уроков для 5–11 классов</h1>
            
            <div class="header-left" style="display:none !important;"></div>

            <div class="header-center">
                <span class="day-indicator" id="dayIndicator">ПН</span>
                <span class="period" id="currentPeriod" aria-live="off">Загрузка...</span>
            </div>

            <div class="header-right">
                <div id="clockContainer"></div>
            </div>
        </header>

        <!-- ===== PWA ===== -->
        <div id="pwaNotification">
            <p>📱 <strong>Установите приложение</strong><br>
            <span class="small">Нажмите "Добавить на главный экран" в браузере</span></p>
        </div>

        <!-- ===== ОСНОВНАЯ ЧАСТЬ ===== -->
        <main class="main-layout" id="mainContent" tabindex="-1">
            <p id="scheduleStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">Загружаем расписание…</p>
            
            <div class="table-wrapper" id="tableWrapper">
                <!-- Мобильные контролы: выбор класса -->
                <div class="mobile-controls" role="group" aria-labelledby="mobileFilterLabel">
                    <label id="mobileFilterLabel" for="mobileClassFilter">Показать класс</label>
                    <select id="mobileClassFilter" aria-controls="tilesView">
                        <option value="all">Все классы</option>
                        <option value="5А">5А</option>
                        <option value="5Б">5Б</option>
                        <option value="6А">6А</option>
                        <option value="6Б">6Б</option>
                        <option value="6В">6В</option>
                        <option value="7А">7А</option>
                        <option value="7Б">7Б</option>
                        <option value="7В">7В</option>
                        <option value="8А">8А</option>
                        <option value="8Б">8Б</option>
                        <option value="8В">8В</option>
                        <option value="9А">9А</option>
                        <option value="9Б">9Б</option>
                        <option value="9В">9В</option>
                        <option value="10А">10А</option>
                        <option value="10Б">10Б</option>
                        <option value="11А">11А</option>
                        <option value="11Б">11Б</option>
                    </select>
                </div>

                <!-- Плиточное расписание -->
                <div class="tiles-view" id="tilesView" role="region" aria-labelledby="tilesScheduleHeading" aria-describedby="scheduleStatus">
                    <div class="loading-overlay" style="height: auto; padding: 20px 0;">
                        ⏳ Загрузка...
                        <span class="sub" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== ПОДВАЛ ===== -->
        <footer class="footer no-print">
            <div class="footer-status" aria-label="Состояние расписания">
                <span class="schedule-updated" id="scheduleUpdated">📅 загрузка...</span>
                <span class="footer-status-separator" aria-hidden="true">·</span>
                <span class="board-sync loading" id="boardSync" aria-live="off">Подключение…</span>
            </div>
        </footer>
    </div>

    <script>
        // ================================================================
        // КОНФИГУРАЦИЯ
        // ================================================================
        var APP_VERSION = '4.5.6';
        var LESSON_TIMES = [
            { num: 1, start: "08:30", end: "09:10", break: "10" },
            { num: 2, start: "09:20", end: "10:00", break: "10" },
            { num: 3, start: "10:10", end: "10:50", break: "15" },
            { num: 4, start: "11:05", end: "11:45", break: "15" },
            { num: 5, start: "12:00", end: "12:40", break: "15" },
            { num: 6, start: "12:55", end: "13:35", break: "10" },
            { num: 7, start: "13:45", end: "14:25", break: "10" },
            { num: 8, start: "14:35", end: "15:15", break: "10" },
            { num: 9, start: "15:25", end: "16:05", break: "10" }
        ];

        var BREAK_ICONS = ['🍎', '💧', '☕', '🍲', '🍛', '☕', '🧃', '🥐'];

        var MAX_LESSONS = 9;
        var PRIMARY_CLASSES = ['5А', '5Б', '6А', '6Б', '6В', '7А', '7Б', '7В', '8А', '8Б', '8В', '9А', '9Б', '9В', '10А', '10Б', '11А', '11Б'];
        var DAYS_SHORT = { 1: "ПН", 2: "ВТ", 3: "СР", 4: "ЧТ", 5: "ПТ", 6: "СБ", 0: "ВС" };
        var DAYS_FULL = { 1: "Понедельник", 2: "Вторник", 3: "Среда", 4: "Четверг", 5: "Пятница", 6: "Суббота", 0: "Воскресенье" };
        var DAYS_LIST = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];

        var STORAGE_KEY_CLASS = 'schedule_selected_class';

        var weekDays = {};
        var classNames = [];
        var dataLoaded = false;
        var scheduleUpdatedDate = null;
        var deferredPrompt = null;
        var lastBoardRenderKey = '';
        var dataRequestInFlight = false;
        var DATA_REFRESH_INTERVAL_MS = 2400000;

        function showNotification(message, type) {
            var el = document.getElementById('notification');
            var msg = document.getElementById('notificationMessage');
            if (!el || !msg) return;
            el.className = 'notification show ' + (type || 'info');
            msg.textContent = message;
            clearTimeout(el._timeout);
            el._timeout = setTimeout(function() { el.classList.remove('show'); }, 4000);
        }

        function parseTime(timeStr) {
            var parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function formatMinutes(minutes) {
            if (!minutes || minutes <= 0) return '0 мин';
            var rounded = Math.ceil(minutes);
            if (rounded >= 60) {
                var hours = Math.floor(rounded / 60);
                var mins = rounded % 60;
                return mins === 0 ? hours + ' ч' : hours + ' ч ' + mins + ' мин';
            }
            return rounded + ' мин';
        }

        function getNowMinutes() {
            var now = new Date();
            return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        }

        function getBreakInfo(breakIndex) {
            if (breakIndex < 0 || breakIndex >= LESSON_TIMES.length - 1) return null;
            var currentLesson = LESSON_TIMES[breakIndex];
            var nextLesson = LESSON_TIMES[breakIndex + 1];
            if (!currentLesson || !nextLesson) return null;

            var start = currentLesson.end;
            var end = nextLesson.start;
            var duration = parseTime(end) - parseTime(start);
            if (duration <= 0) return null;

            return {
                index: breakIndex,
                afterLesson: currentLesson.num,
                beforeLesson: nextLesson.num,
                start: start,
                end: end,
                duration: duration,
                startMin: parseTime(start),
                endMin: parseTime(end),
                icon: BREAK_ICONS[breakIndex % BREAK_ICONS.length]
            };
        }

        function getBreakStatus(breakInfo) {
            if (!breakInfo) return 'future';
            var nowMin = getNowMinutes();
            if (nowMin < breakInfo.startMin) return 'future';
            if (nowMin >= breakInfo.endMin) return 'past';
            return 'now';
        }

        function getBreakProgress(breakInfo) {
            if (!breakInfo) return 0;
            var nowMin = getNowMinutes();
            var total = breakInfo.endMin - breakInfo.startMin;
            if (total <= 0) return 0;
            var passed = nowMin - breakInfo.startMin;
            if (passed < 0) return 0;
            if (passed > total) return 100;
            return (passed / total) * 100;
        }

        function getCurrentPeriodInfo() {
            var now = new Date();
            var totalMinutes = now.getHours() * 60 + now.getMinutes();
            var dayOfWeek = now.getDay();

            if (dayOfWeek === 0) {
                return { type: 'sunday' };
            }

            for (var i = 0; i < LESSON_TIMES.length; i++) {
                var lesson = LESSON_TIMES[i];
                var startMin = parseTime(lesson.start);
                var endMin = parseTime(lesson.end);
                if (totalMinutes >= startMin && totalMinutes < endMin) {
                    return { type: 'lesson', num: lesson.num, start: lesson.start, end: lesson.end };
                }
            }

            for (var i = 0; i < LESSON_TIMES.length; i++) {
                var lesson = LESSON_TIMES[i];
                var startMin = parseTime(lesson.start);
                if (i > 0) {
                    var prevEndMin = parseTime(LESSON_TIMES[i - 1].end);
                    if (totalMinutes >= prevEndMin && totalMinutes < startMin) {
                        return { type: 'break', nextLesson: lesson.num, nextStart: lesson.start, remaining: startMin - totalMinutes, breakIndex: i - 1 };
                    }
                }
                if (i === 0 && totalMinutes < startMin) {
                    return { type: 'before', nextLesson: lesson.num, nextStart: lesson.start, remaining: startMin - totalMinutes };
                }
            }

            var lastEndMin = parseTime(LESSON_TIMES[LESSON_TIMES.length - 1].end);
            if (totalMinutes >= lastEndMin) {
                return { type: 'after' };
            }
            return { type: 'unknown' };
        }

        function getPeriodName() {
            var info = getCurrentPeriodInfo();
            var now = new Date();
            var totalMinutes = now.getHours() * 60 + now.getMinutes();

            if (info.type === 'sunday') {
                return '<span class="line1">📌 Изменения</span><span class="line2">на понедельник</span>';
            }
            if (info.type === 'lesson') {
                return '<span class="line1">📖 ' + info.num + '-й урок</span><span class="line2">' + info.start + '–' + info.end + '</span>';
            }
            if (info.type === 'break') {
                var breakInfo = getBreakInfo(info.breakIndex);
                var timeStr = breakInfo ? (breakInfo.start + '–' + breakInfo.end) : '';
                if (info.remaining <= 0) {
                    return '<span class="line1">⏰ ' + info.nextLesson + '-й урок</span><span class="line2">начинается</span>';
                }
                return '<span class="line1">⏸ Перемена</span><span class="line2">' + timeStr + ' · осталось ' + formatMinutes(info.remaining) + '</span>';
            }
            if (info.type === 'before') {
                if (info.remaining <= 0) {
                    return '<span class="line1">⏰ ' + info.nextLesson + '-й урок</span><span class="line2">начинается</span>';
                }
                return '<span class="line1">⏳ До начала занятий</span><span class="line2">' + formatMinutes(info.remaining) + '</span>';
            }
            if (info.type === 'after') {
                var dayNum = now.getDay();
                var nextDayNum = dayNum + 1;
                if (nextDayNum === 7) nextDayNum = 1;
                if (nextDayNum === 0) nextDayNum = 1;
                var nextDayFull = DAYS_FULL[nextDayNum] || 'Понедельник';
                var dayGenitive = {
                    'Понедельник': 'понедельник',
                    'Вторник': 'вторник',
                    'Среда': 'среду',
                    'Четверг': 'четверг',
                    'Пятница': 'пятницу',
                    'Суббота': 'субботу',
                    'Воскресенье': 'воскресенье'
                };
                var nextDayGen = dayGenitive[nextDayFull] || nextDayFull.toLowerCase();
                return '<span class="line1">📌 Изменения</span><span class="line2">на ' + nextDayGen + '</span>';
            }
            return '<span class="line1">⏰ Загрузка...</span>';
        }

        function getTargetDay() {
            var now = new Date();
            var dayNum = now.getDay();
            var totalMinutes = now.getHours() * 60 + now.getMinutes();
            
            var targetDayNum = dayNum;
            if (dayNum === 0 || totalMinutes >= 16 * 60) {
                targetDayNum = dayNum + 1;
                if (targetDayNum > 6) targetDayNum = 1;
            }
            
            var dayKey = DAYS_SHORT[targetDayNum] || "ПН";
            var dayFull = DAYS_FULL[targetDayNum] || "Понедельник";

            if (weekDays[dayKey] && Object.keys(weekDays[dayKey]).length > 0) {
                return { key: dayKey, full: dayFull };
            }

            for (var i = 0; i < DAYS_LIST.length; i++) {
                var d = DAYS_LIST[i];
                if (weekDays[d] && Object.keys(weekDays[d]).length > 0) {
                    return { key: d, full: DAYS_FULL[DAYS_LIST.indexOf(d) + 1] || d };
                }
            }
            return { key: dayKey, full: dayFull };
        }

        function formatDateForDisplay(dateValue) {
            if (!dateValue) return null;
            var d = new Date(dateValue);
            if (isNaN(d.getTime())) return null;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function saveSelectedClass(value) {
            try {
                if (value === 'all') {
                    localStorage.removeItem(STORAGE_KEY_CLASS);
                } else {
                    localStorage.setItem(STORAGE_KEY_CLASS, value);
                }
            } catch (e) {
                console.warn('Не удалось сохранить выбранный класс:', e);
            }
        }

        function restoreSelectedClass() {
            try {
                var saved = localStorage.getItem(STORAGE_KEY_CLASS);
                var select = document.getElementById('mobileClassFilter');
                if (select && saved) {
                    var exists = false;
                    for (var i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === saved) {
                            exists = true;
                            break;
                        }
                    }
                    if (exists) {
                        select.value = saved;
                        return saved;
                    }
                }
            } catch (e) {
                console.warn('Не удалось восстановить выбранный класс:', e);
            }
            return 'all';
        }

        function loadData() {
            if (dataRequestInFlight) return;
            dataRequestInFlight = true;
            var statusEl = document.getElementById('scheduleStatus');
            if (statusEl) statusEl.textContent = 'Загружаем расписание…';
            setBoardSync('loading', 'Обновляем данные…');

            var cacheBuster = Math.floor(Date.now() / 3600000);
            var url = 'schedule.primary.json?t=' + cacheBuster;

            fetch(url, { cache: 'default' })
                .then(function(res) {
                    if (!res.ok) throw new Error('schedule.primary.json не найден (код ' + res.status + ')');
                    
                    var etag = res.headers.get('ETag');
                    if (etag) {
                        var cachedEtag = localStorage.getItem('schedule_etag');
                        if (cachedEtag === etag) {
                            if (statusEl) statusEl.textContent = '✅ данные актуальны (ETag)';
                            return res.json();
                        }
                        localStorage.setItem('schedule_etag', etag);
                        if (statusEl) statusEl.textContent = '🔄 данные обновлены (новый ETag)';
                    } else {
                        if (statusEl) statusEl.textContent = '⚠️ ETag не поддерживается';
                    }
                    return res.json();
                })
                .then(function(data) {
                    var scheduleData = null;
                    var updatedDate = data.updated || data.last_update || (data.meta && data.meta.updated) || null;

                    if (updatedDate) {
                        var formatted = formatDateForDisplay(updatedDate);
                        if (formatted) {
                            scheduleUpdatedDate = formatted;
                            document.getElementById('scheduleUpdated').textContent = '📅 ' + formatted;
                            document.getElementById('scheduleUpdated').className = 'schedule-updated';
                        } else {
                            document.getElementById('scheduleUpdated').textContent = '📅 дата не указана';
                            document.getElementById('scheduleUpdated').className = 'schedule-updated error';
                        }
                    } else {
                        document.getElementById('scheduleUpdated').textContent = '📅 дата не указана';
                        document.getElementById('scheduleUpdated').className = 'schedule-updated error';
                    }

                    if (data.schedule) {
                        scheduleData = data.schedule.primary || data.schedule;
                    } else if (data.primary) {
                        scheduleData = data.primary;
                    } else {
                        scheduleData = data;
                    }

                    var hasDays = false;
                    DAYS_LIST.forEach(function(day) {
                        if (scheduleData && scheduleData[day]) {
                            hasDays = true;
                            var filtered = {};
                            Object.keys(scheduleData[day]).forEach(function(cls) {
                                if (PRIMARY_CLASSES.indexOf(cls) !== -1) {
                                    filtered[cls] = scheduleData[day][cls];
                                }
                            });
                            weekDays[day] = Object.keys(filtered).length > 0 ? filtered : {};
                        }
                    });

                    if (!hasDays) {
                        DAYS_LIST.forEach(function(day) { weekDays[day] = {}; });
                    }

                    if (statusEl) statusEl.textContent = 'Расписание обновлено.';
                    processLoadedData();
                    lastBoardRenderKey = getBoardRenderKey();
                    setBoardSync('online', 'Данные актуальны');
                })
                .catch(function(err) {
                    console.warn('Ошибка загрузки schedule.primary.json:', err.message);
                    if (statusEl) statusEl.textContent = 'Не удалось обновить расписание. Проверьте соединение и попробуйте снова.';
                    DAYS_LIST.forEach(function(day) { weekDays[day] = {}; });
                    document.getElementById('scheduleUpdated').textContent = '📅 ошибка загрузки';
                    document.getElementById('scheduleUpdated').className = 'schedule-updated error';
                    setBoardSync('offline', 'Нет связи · показываем последние данные');
                    processLoadedData();
                })
                .finally(function() {
                    dataRequestInFlight = false;
                });
        }

        function processLoadedData() {
            classNames = PRIMARY_CLASSES;

            DAYS_LIST.forEach(function(day) {
                var dayData = weekDays[day] || {};
                classNames.forEach(function(cls) {
                    if (!dayData[cls]) {
                        dayData[cls] = [];
                        for (var i = 0; i < MAX_LESSONS; i++) {
                            dayData[cls].push(['', '']);
                        }
                    } else {
                        var lessons = dayData[cls];
                        while (lessons.length < MAX_LESSONS) {
                            lessons.push(['', '']);
                        }
                    }
                });
                weekDays[day] = dayData;
            });

            dataLoaded = true;
            renderTiles();
            lastBoardRenderKey = getBoardRenderKey();
        }

        function escapeHTML(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isEmptyLesson(value) {
            var normalized = String(value == null ? '' : value).trim().toLowerCase();
            return normalized === '' || normalized === 'нет урока' || normalized === 'нет' || normalized === '—' || normalized === '-';
        }

        function sortClasses(classes) {
            var letters = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
            return classes.sort(function(a, b) {
                var numA = parseInt(a.match(/\d+/)?.[0] || 0);
                var numB = parseInt(b.match(/\d+/)?.[0] || 0);
                if (numA !== numB) return numA - numB;
                var lA = a.match(/[А-Я]/)?.[0] || '';
                var lB = b.match(/[А-Я]/)?.[0] || '';
                return letters.indexOf(lA) - letters.indexOf(lB);
            });
        }

        function renderTiles() {
            if (!dataLoaded && Object.keys(weekDays).length === 0) return;

            var targetDay = getTargetDay();
            var dayKey = targetDay.key;

            var currentLesson = 0;
            var info = getCurrentPeriodInfo();
            if (info.type === 'lesson') {
                currentLesson = info.num;
            } else if (info.type === 'break' || info.type === 'before') {
                currentLesson = info.nextLesson - 1;
                if (currentLesson < 0) currentLesson = 0;
            }

            document.getElementById('currentPeriod').innerHTML = getPeriodName();

            var dayData = weekDays[dayKey];
            if (!dayData || Object.keys(dayData).length === 0) {
                document.getElementById('tilesView').innerHTML = '<div style="text-align:center;padding:30px 0;color:#a0aec0;">📌 Нет расписания на ' + targetDay.full + '</div>';
                return;
            }

            var classes = Object.keys(dayData).filter(function(cls) { return PRIMARY_CLASSES.indexOf(cls) !== -1; });
            if (classes.length === 0) classes = PRIMARY_CLASSES;
            classes = sortClasses(classes);

            var mobileClassFilter = document.getElementById('mobileClassFilter');
            var selectedClass = mobileClassFilter ? mobileClassFilter.value : 'all';
            if (selectedClass !== 'all' && classes.indexOf(selectedClass) !== -1) {
                classes = [selectedClass];
            }

            var html = '';

            classes.forEach(function(className) {
                var lessons = dayData[className] || [];

                html += '<div class="tiles-class-header" role="heading" aria-level="2">' + escapeHTML(className) + ' · ' + targetDay.full + '</div>';

                for (var i = 0; i < MAX_LESSONS; i++) {
                    var lessonNum = i + 1;
                    var lesson = lessons[i] || ['', ''];
                    var subject = Array.isArray(lesson) ? lesson[0] : (lesson.subject || lesson[0] || '');
                    var cabinet = Array.isArray(lesson) ? lesson[1] : (lesson.room || lesson[1] || '');
                    var isCurrent = (lessonNum === currentLesson);
                    var hasContent = !isEmptyLesson(subject);

                    var timeStart = LESSON_TIMES[i].start;
                    var timeEnd = LESSON_TIMES[i].end;
                    var timeRange = timeStart + '–' + timeEnd;

                    html += '<div class="tiles-row' + (isCurrent ? ' current-lesson-row' : '') + '" role="row">';
                    html += '<div class="tile-number" role="rowheader">' + lessonNum + '</div>';

                    if (hasContent) {
                        html += '<div class="tile-subject" role="cell">';
                        html += '<div class="subject-line">';
                        html += '<span class="subject-name">' + escapeHTML(subject) + '</span>';
                        html += '<span class="lesson-meta">' + timeRange + '</span>';
                        html += '</div>';
                        if (cabinet && cabinet.trim() !== '') {
                            html += '<span class="subject-room">каб. ' + escapeHTML(cabinet) + '</span>';
                        }
                        html += '</div>';
                    } else {
                        html += '<div class="tile-subject empty-tile" role="cell">';
                        html += '<div class="subject-line">';
                        html += '<span class="subject-name">—</span>';
                        html += '<span class="lesson-meta">' + timeRange + '</span>';
                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';

                    if (lessonNum < MAX_LESSONS) {
                        var breakInfo = getBreakInfo(i);
                        if (breakInfo) {
                            var status = getBreakStatus(breakInfo);
                            var progress = getBreakProgress(breakInfo);

                            var rowClass = 'tiles-break-row';
                            if (status === 'now') rowClass += ' current-break-row';
                            else if (status === 'past') rowClass += ' past-break-row';

                            var statusText = '';
                            var statusClass = '';
                            if (status === 'past') {
                                statusText = 'завершена';
                                statusClass = 'status-past';
                            } else if (status === 'now') {
                                statusText = 'идёт сейчас';
                                statusClass = 'status-now';
                            } else {
                                statusText = 'впереди';
                                statusClass = 'status-future';
                            }

                            html += '<div class="' + rowClass + '" role="row" aria-label="Перемена ' + breakInfo.start + '–' + breakInfo.end + '">';
                            if (status === 'now') {
                                html += '<div class="break-progress" style="width:' + progress.toFixed(1) + '%"></div>';
                            }
                            html += '<div class="break-content" role="cell">';
                            html += '<div class="break-left">';
                            html += '<span class="break-time">' + breakInfo.start + ' – ' + breakInfo.end + '</span>';
                            html += '</div>';
                            html += '<div class="break-right">';
                            html += '<span class="break-duration">' + breakInfo.duration + ' мин</span>';
                            html += '<span class="break-status ' + statusClass + '">' + statusText + '</span>';
                            html += '</div>';
                            html += '</div>';
                            html += '</div>';
                        }
                    }
                }
            });

            document.getElementById('tilesView').innerHTML = html;
        }

        function getBoardRenderKey() {
            var targetDay = getTargetDay();
            var info = getCurrentPeriodInfo();
            var activeLesson = 0;
            var breakKey = '';
            if (info.type === 'lesson') {
                activeLesson = info.num;
            } else if (info.type === 'break') {
                activeLesson = Math.max(0, info.nextLesson - 1);
                breakKey = 'b' + info.breakIndex;
            } else if (info.type === 'before') {
                activeLesson = Math.max(0, info.nextLesson - 1);
            }
            return targetDay.key + '|' + info.type + '|' + activeLesson + '|' + breakKey;
        }

        function setBoardSync(state, message) {
            var sync = document.getElementById('boardSync');
            if (!sync) return;
            sync.className = 'board-sync ' + state;
            sync.textContent = message;
        }

        function updateCurrentBreakProgress() {
            var info = getCurrentPeriodInfo();
            if (info.type !== 'break') return;
            var breakInfo = getBreakInfo(info.breakIndex);
            if (!breakInfo) return;
            var progress = getBreakProgress(breakInfo);
            var progressEl = document.querySelector('.tiles-break-row.current-break-row .break-progress');
            if (progressEl) {
                progressEl.style.width = progress.toFixed(1) + '%';
            }
        }

        function refreshAll() {
            document.getElementById('currentPeriod').innerHTML = getPeriodName();
            if (!dataLoaded && Object.keys(weekDays).length === 0) return;
            var renderKey = getBoardRenderKey();
            if (renderKey !== lastBoardRenderKey) {
                lastBoardRenderKey = renderKey;
                renderTiles();
            } else {
                updateCurrentBreakProgress();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initClock === 'function') {
                initClock('clockContainer');
            } else {
                console.warn('clock.js не загружен или функция initClock не найдена');
            }

            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                var pwaNotification = document.getElementById('pwaNotification');
                if (pwaNotification) pwaNotification.style.display = 'block';
            });

            restoreSelectedClass();

            var mobileClassFilter = document.getElementById('mobileClassFilter');
            if (mobileClassFilter) {
                mobileClassFilter.addEventListener('change', function() {
                    saveSelectedClass(this.value);
                    renderTiles();
                    var tilesView = document.getElementById('tilesView');
                    if (tilesView) tilesView.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            loadData();

            var resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    renderTiles();
                    refreshAll();
                }, 120);
            });

            setInterval(refreshAll, 1000);
            setInterval(loadData, DATA_REFRESH_INTERVAL_MS);

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) loadData();
            });
            window.addEventListener('online', loadData);

            console.log('✅ Плиточное расписание v' + APP_VERSION + ' загружено!');
        });
    </script>
</body>
</html>
