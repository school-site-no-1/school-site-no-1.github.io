<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📋 Расписание начальной школы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: #e8f5e9;
            padding: 20px;
            color: #1b3a1b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #a5d6a7;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 3px solid #66bb6a;
            margin-bottom: 28px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .header-left h1 {
            font-size: 1.9em;
            color: #1b5e20;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-left .change-label {
            color: #e65100;
            font-size: 0.9em;
            font-weight: 600;
            background: #fff3e0;
            padding: 4px 16px;
            border-radius: 12px;
            border: 1px solid #ffcc80;
            display: inline-block;
            width: fit-content;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .header-right .current-date {
            color: #2e7d32;
            font-size: 0.85em;
            font-weight: 500;
            order: 1;
        }
        .header-right .day-label {
            background: #2e7d32;
            color: #ffffff;
            padding: 6px 20px;
            border-radius: 24px;
            font-size: 0.95em;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.25);
            order: 0;
        }
        .header-right .day-label .day-short {
            display: none;
        }

        /* ===== ФИЛЬТР (только для мобильных) ===== */
        .filter-container {
            display: none;
            margin-bottom: 20px;
            padding: 8px 12px;
            background: #f1f8e9;
            border-radius: 12px;
            border: 1px solid #c8e6c9;
            position: relative;
        }
        .filter-select-wrapper {
            position: relative;
        }
        .filter-select-wrapper select {
            width: 100%;
            padding: 10px 16px;
            font-size: 0.95em;
            font-weight: 600;
            color: #2e7d32;
            background: #ffffff;
            border: 2px solid #a5d6a7;
            border-radius: 12px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        }
        .filter-select-wrapper select:hover {
            border-color: #66bb6a;
        }
        .filter-select-wrapper select:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }
        .filter-select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
            font-size: 0.7em;
            pointer-events: none;
        }

        /* ===== СЕТКА РАСПИСАНИЯ ===== */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            flex: 1;
            padding: 12px 0;
        }
        .schedule-row {
            display: flex;
            gap: 20px;
        }
        .schedule-block {
            flex: 1;
            border: 1px solid #c8e6c9;
            border-radius: 14px;
            overflow: hidden;
            min-width: 0;
            background: #ffffff;
            transition: box-shadow 0.2s ease;
            margin-bottom: 10px;
        }
        .schedule-block:last-child {
            margin-bottom: 0;
        }
        .schedule-block:hover {
            box-shadow: 0 4px 16px rgba(46, 125, 50, 0.10);
        }
        .schedule-block.hidden {
            display: none;
        }
        .class-header {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 8px 12px;
            font-weight: 700;
            font-size: 1em;
            border-bottom: 2px solid #66bb6a;
            text-align: center;
            color: #1b5e20;
            letter-spacing: 0.3px;
        }
        .lessons-table {
            width: 100%;
            border-collapse: collapse;
        }
        .lessons-table td {
            padding: 5px 8px;
            border: 1px solid #e8f5e9;
            vertical-align: middle;
        }
        .lesson-number {
            width: 30px;
            text-align: center;
            font-weight: 700;
            color: #388e3c;
            font-size: 0.85em;
            background: #f1f8e9;
        }
        .lesson-subject {
            padding-left: 10px;
            font-weight: 500;
            font-size: 0.9em;
            color: #1b3a1b;
        }
        .lesson-room {
            text-align: center;
            font-weight: 600;
            color: #e65100;
            font-size: 0.85em;
            width: 60px;
            background: #fff3e0;
        }
        .lesson-empty {
            color: #a5d6a7;
            font-style: italic;
            font-weight: 400;
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 2px solid #e8f5e9;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer .version {
            color: #66bb6a;
            font-size: 0.75em;
            font-weight: 500;
            background: #e8f5e9;
            padding: 4px 14px;
            border-radius: 12px;
        }

        /* ===== СОСТОЯНИЯ ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #81c784;
        }
        .loading .spinner {
            font-size: 2.8em;
            display: block;
            margin-bottom: 12px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .title {
            font-size: 1.1em;
            color: #388e3c;
        }
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #c62828;
        }
        .error .icon {
            font-size: 2.8em;
            display: block;
            margin-bottom: 12px;
        }
        .error .title {
            font-size: 1.1em;
            font-weight: 600;
        }
        .error .sub {
            color: #66bb6a;
            font-size: 0.9em;
            margin-top: 4px;
        }
        .error .btn-retry {
            margin-top: 16px;
            padding: 8px 24px;
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: background 0.2s;
        }
        .error .btn-retry:hover {
            background: #1b5e20;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media print {
            body {
                padding: 8px;
                background: #fff;
            }
            .container {
                box-shadow: none;
                border: 1px solid #c8e6c9;
            }
            .schedule-block {
                break-inside: avoid;
            }
            .header-right .day-label {
                background: #2e7d32;
                color: #fff;
            }
            .error .btn-retry {
                display: none;
            }
            .filter-container {
                display: none !important;
            }
        }

        @media (min-width: 769px) {
            .container {
                padding: 48px 40px;
            }
            .schedule-grid {
                padding: 16px 0;
                gap: 44px;
            }
            .schedule-row {
                gap: 24px;
            }
            .schedule-block {
                flex: 1;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 1200px) {
            .schedule-row {
                flex-wrap: wrap;
            }
            .schedule-block {
                flex: 0 0 calc(50% - 10px);
            }
            .schedule-grid {
                gap: 35px;
            }
        }

        @media (max-width: 768px) {
            .filter-container {
                display: block;
            }
            .schedule-block {
                flex: 0 0 100%;
            }
            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .header-left {
                align-items: center;
            }
            .header-left .change-label {
                width: 100%;
                text-align: center;
            }
            .header-right {
                align-items: center;
            }
            .container {
                padding: 24px 16px;
            }
            .header-left h1 {
                font-size: 1.4em;
            }
            .header-right .day-label {
                font-size: 0.85em;
                padding: 4px 14px;
            }
            .header-right .day-label .day-short {
                display: none;
            }
            .schedule-row {
                gap: 16px;
            }
            .schedule-grid {
                gap: 30px;
                padding: 8px 0;
            }
            .footer {
                justify-content: center;
            }
            .schedule-block {
                margin-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px 12px;
            }
            .schedule-block {
                border-radius: 10px;
                margin-bottom: 10px;
            }
            .class-header {
                font-size: 0.85em;
                padding: 5px 8px;
            }
            .lessons-table td {
                padding: 3px 4px;
            }
            .lesson-number {
                width: 24px;
                font-size: 0.75em;
            }
            .lesson-subject {
                font-size: 0.75em;
                padding-left: 6px;
            }
            .lesson-room {
                font-size: 0.7em;
                width: 40px;
            }
            .schedule-row {
                gap: 12px;
            }
            .schedule-grid {
                gap: 25px;
            }
            .filter-container {
                padding: 6px 10px;
            }
            .filter-select-wrapper select {
                font-size: 0.85em;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <div class="header-left">
                <h1>🌱 Расписание начальной школы</h1>
                <span class="change-label" id="changeLabel">Загрузка...</span>
            </div>
            <div class="header-right">
                <span class="day-label" id="dayLabel">
                    <span class="day-full">Загрузка...</span>
                    <span class="day-short"></span>
                </span>
                <span class="current-date" id="currentDate"></span>
            </div>
        </div>

        <!-- Фильтр для мобильных устройств (выпадающий список с отдельными классами) -->
        <div class="filter-container" id="filterContainer">
            <div class="filter-select-wrapper">
                <select id="classFilter">
                    <option value="all">📚 Все классы</option>
                    <option value="1А">1А</option>
                    <option value="1Б">1Б</option>
                    <option value="1В">1В</option>
                    <option value="2А">2А</option>
                    <option value="2Б">2Б</option>
                    <option value="2В">2В</option>
                    <option value="3А">3А</option>
                    <option value="3Б">3Б</option>
                    <option value="3В">3В</option>
                    <option value="4А">4А</option>
                    <option value="4Б">4Б</option>
                    <option value="4В">4В</option>
                </select>
            </div>
        </div>

        <div id="scheduleContainer" style="flex:1;">
            <div class="loading" id="loadingState">
                <span class="spinner">🌿</span>
                <div class="title">Загрузка расписания...</div>
            </div>
            <div class="schedule-grid" id="scheduleGrid" style="display:none;"></div>
            <div class="error" id="errorState" style="display:none;">
                <span class="icon">🍃</span>
                <div class="title">Ошибка загрузки данных</div>
                <div class="sub" id="errorMessage">Не удалось загрузить расписание</div>
                <button class="btn-retry" onclick="loadData()">🔄 Попробовать снова</button>
            </div>
        </div>

        <div class="footer">
            <span class="version" id="versionBadge">v1.9.0</span>
        </div>
    </div>

    <script>
        // ================================================================
        // ВЕРСИЯ
        // ================================================================
        var APP_VERSION = '1.9.0';

        // ================================================================
        // КОНФИГУРАЦИЯ
        // ================================================================
        var CONFIG = {
            DAYS: ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'],
            DAYS_RU: ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'],
            DAYS_RU_GENITIVE: ['понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу'],
            CLASSES: ['1А', '1Б', '1В', '2А', '2Б', '2В', '3А', '3Б', '3В', '4А', '4Б', '4В'],
            MAX_LESSONS: 6
        };

        // ================================================================
        // СОСТОЯНИЕ
        // ================================================================
        var state = {
            data: null,
            currentDay: null,
            displayDay: null,
            loaded: false,
            isNextDay: false,
            filter: 'all',
            isWeekend: false
        };

        // ================================================================
        // ОПРЕДЕЛЕНИЕ ТЕКУЩЕГО ДНЯ И ДНЯ ДЛЯ ПОКАЗА
        // ================================================================
        function getCurrentDay() {
            var now = new Date();
            var dayNum = now.getDay(); // 0 = воскресенье, 6 = суббота
            if (dayNum === 0) return 'ВС';
            if (dayNum === 6) return 'СБ';
            return CONFIG.DAYS[dayNum - 1] || 'ПН';
        }

        function getNextDay(day) {
            var index = CONFIG.DAYS.indexOf(day);
            if (index === -1) return 'ПН';
            var nextIndex = (index + 1) % CONFIG.DAYS.length;
            return CONFIG.DAYS[nextIndex];
        }

        function getDisplayDay() {
            var now = new Date();
            var hours = now.getHours();
            var dayKey = getCurrentDay();
            
            // Если сегодня воскресенье или суббота — показываем понедельник
            if (dayKey === 'ВС' || dayKey === 'СБ') {
                state.isWeekend = true;
                state.isNextDay = true;
                return 'ПН';
            }

            state.isWeekend = false;

            // После 16:00 показываем следующий день (если он есть в данных)
            if (hours >= 16) {
                var nextDay = getNextDay(dayKey);
                if (state.data && state.data[nextDay]) {
                    state.isNextDay = true;
                    return nextDay;
                }
                state.isNextDay = false;
                return dayKey;
            }

            state.isNextDay = false;
            return dayKey;
        }

        function getDisplayDayFull(dayKey) {
            if (dayKey === 'ВС') return 'Воскресенье';
            if (dayKey === 'СБ') return 'Суббота';
            return CONFIG.DAYS_RU[CONFIG.DAYS.indexOf(dayKey)] || dayKey;
        }

        function getDayGenitive(dayKey) {
            if (dayKey === 'ВС') return 'воскресенье';
            if (dayKey === 'СБ') return 'субботу';
            var index = CONFIG.DAYS.indexOf(dayKey);
            if (index === -1) return 'среду';
            return CONFIG.DAYS_RU_GENITIVE[index] || 'среду';
        }

        // ================================================================
        // ПРЕОБРАЗОВАНИЕ ДАННЫХ
        // ================================================================
        function convertLessons(lessonsArray) {
            if (!lessonsArray || !Array.isArray(lessonsArray)) {
                return [];
            }
            return lessonsArray.map(function(item, index) {
                if (Array.isArray(item)) {
                    return {
                        lesson: index + 1,
                        subject: item[0] || '',
                        room: item[1] || ''
                    };
                } else if (item && typeof item === 'object' && item.subject !== undefined) {
                    return item;
                }
                return {
                    lesson: index + 1,
                    subject: '',
                    room: ''
                };
            });
        }

        function convertDayData(dayData) {
            if (!dayData || typeof dayData !== 'object') {
                return {};
            }
            var result = {};
            for (var className in dayData) {
                if (dayData.hasOwnProperty(className)) {
                    result[className] = convertLessons(dayData[className]);
                }
            }
            return result;
        }

        function convertFullData(data) {
            if (!data || typeof data !== 'object') {
                return {};
            }
            var result = {};
            for (var day in data) {
                if (data.hasOwnProperty(day)) {
                    result[day] = convertDayData(data[day]);
                }
            }
            return result;
        }

        // ================================================================
        // ИЗВЛЕЧЕНИЕ ДАННЫХ НАЧАЛЬНОЙ ШКОЛЫ ИЗ JSON
        // ================================================================
        function extractElementaryData(data) {
            if (data.schedule && data.schedule.elementary) {
                return data.schedule.elementary;
            }
            if (data.elementary) {
                return data.elementary;
            }
            var days = CONFIG.DAYS;
            for (var i = 0; i < days.length; i++) {
                if (data[days[i]]) {
                    return data;
                }
            }
            return null;
        }

        function hasElementaryData(data) {
            var classes = CONFIG.CLASSES;
            for (var day in data) {
                if (data[day]) {
                    for (var i = 0; i < classes.length; i++) {
                        if (data[day][classes[i]]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ================================================================
        // ЗАГРУЗКА ДАННЫХ
        // ================================================================
        function loadData() {
            var loadingEl = document.getElementById('loadingState');
            var gridEl = document.getElementById('scheduleGrid');
            var errorEl = document.getElementById('errorState');

            loadingEl.style.display = 'block';
            gridEl.style.display = 'none';
            errorEl.style.display = 'none';

            fetch('data_elementary.json')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Файл data_elementary.json не найден (HTTP ' + response.status + ')');
                    }
                    return response.json();
                })
                .then(function(data) {
                    var rawData = extractElementaryData(data);
                    if (!rawData || !hasElementaryData(rawData)) {
                        throw new Error('В файле нет расписания для начальной школы');
                    }

                    state.data = convertFullData(rawData);
                    state.loaded = true;
                    state.currentDay = getCurrentDay();
                    state.displayDay = getDisplayDay();

                    loadingEl.style.display = 'none';
                    gridEl.style.display = 'block';

                    renderAll();
                })
                .catch(function(err) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    document.getElementById('errorMessage').textContent = err.message;
                });
        }

        // ================================================================
        // ОТОБРАЖЕНИЕ
        // ================================================================
        function renderAll() {
            if (!state.data || !state.loaded) return;
            renderHeader();
            renderSchedule();
            applyFilter();
        }

        function renderHeader() {
            var dayKey = state.currentDay;
            var displayDayKey = state.displayDay || state.currentDay;
            var dayFull = getDisplayDayFull(dayKey);

            var dayLabelEl = document.getElementById('dayLabel');
            var dayFullSpan = dayLabelEl.querySelector('.day-full');
            var dayShortSpan = dayLabelEl.querySelector('.day-short');
            
            dayFullSpan.textContent = '📅 ' + dayFull;
            dayShortSpan.textContent = '';

            var changeLabelEl = document.getElementById('changeLabel');
            
            // ВСЕГДА показываем "Изменения в расписании уроков начальной школы"
            changeLabelEl.textContent = '📋 Изменения в расписании уроков начальной школы';
            changeLabelEl.style.display = 'inline-block';
        }

        function renderSchedule() {
            var container = document.getElementById('scheduleGrid');
            var dayKey = state.displayDay || state.currentDay;
            var dayData = state.data[dayKey];

            // В выходные показываем понедельник
            if (state.isWeekend && (state.currentDay === 'ВС' || state.currentDay === 'СБ')) {
                var mondayData = state.data['ПН'];
                if (mondayData) {
                    container.innerHTML = renderDaySchedule(mondayData);
                } else {
                    container.innerHTML =
                        '<div style="text-align:center;padding:40px 0;color:#a5d6a7;font-size:1.1em;">🌱 Нет данных для понедельника</div>';
                }
                return;
            }

            if (!dayData) {
                container.innerHTML =
                    '<div style="text-align:center;padding:40px 0;color:#a5d6a7;font-size:1.1em;">🌱 Нет данных для ' +
                    getDisplayDayFull(dayKey) + '</div>';
                return;
            }

            container.innerHTML = renderDaySchedule(dayData);
        }

        function renderDaySchedule(dayData) {
            var classes = CONFIG.CLASSES;
            var html = '';
            for (var i = 0; i < classes.length; i += 4) {
                var group = classes.slice(i, i + 4);
                var rowHtml = '<div class="schedule-row">';
                group.forEach(function(cls) {
                    var lessons = dayData[cls] || [];
                    
                    var blockHtml = '<div class="schedule-block" data-class="' + cls + '">';
                    blockHtml += '<div class="class-header">' + cls + '</div>';
                    blockHtml += '<table class="lessons-table">';
                    for (var l = 1; l <= CONFIG.MAX_LESSONS; l++) {
                        var lesson = lessons.find(function(les) { return les && les.lesson === l; });
                        var subject = lesson ? lesson.subject : '';
                        var room = lesson ? lesson.room : '';
                        var isEmpty = !subject || subject === 'нет урока' || subject === '';

                        blockHtml += '<tr>';
                        blockHtml += '<td class="lesson-number">' + l + '</td>';
                        blockHtml += '<td class="lesson-subject' + (isEmpty ? ' lesson-empty' : '') + '">' +
                            (isEmpty ? '—' : subject) +
                            '</td>';
                        blockHtml += '<td class="lesson-room">' + (isEmpty ? '' : room) + '</td>';
                        blockHtml += '</tr>';
                    }
                    blockHtml += '</table></div>';
                    rowHtml += blockHtml;
                });
                rowHtml += '</div>';
                html += rowHtml;
            }
            return html;
        }

        function updateDate() {
            var now = new Date();
            var options = { day: '2-digit', month: 'long', year: 'numeric' };
            document.getElementById('currentDate').textContent = '📅 ' + now.toLocaleDateString('ru-RU', options);
        }

        // ================================================================
        // ФИЛЬТР
        // ================================================================
        function applyFilter() {
            var blocks = document.querySelectorAll('.schedule-block');
            var filterValue = state.filter;
            
            blocks.forEach(function(block) {
                var className = block.getAttribute('data-class');
                if (filterValue === 'all' || className === filterValue) {
                    block.classList.remove('hidden');
                } else {
                    block.classList.add('hidden');
                }
            });
            
            var select = document.getElementById('classFilter');
            if (select) {
                select.value = filterValue;
            }
        }

        // ================================================================
        // ПРОВЕРКА СМЕНЫ ДНЯ
        // ================================================================
        function checkDayChange() {
            if (!state.data || !state.loaded) return;

            var newDisplayDay = getDisplayDay();
            if (newDisplayDay !== state.displayDay) {
                state.displayDay = newDisplayDay;
                renderAll();
            }
        }

        // ================================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            updateDate();
            document.getElementById('versionBadge').textContent = 'v' + APP_VERSION;
            loadData();

            var filterSelect = document.getElementById('classFilter');
            filterSelect.addEventListener('change', function() {
                state.filter = this.value;
                applyFilter();
            });

            setInterval(checkDayChange, 30000);
        });
    </script>

</body>
</html>
